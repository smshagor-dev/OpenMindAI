name: Codex macOS v3.0.1 Build

on:
  push:
    branches:
      - codex/macos-v3.0.1-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-build:
    name: macOS ${{ matrix.target }}
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: arm64
          - target: x86_64-apple-darwin
            label: x64
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate synchronized release version
        run: npm run check:version -- --tag v3.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}-v3.0.1-10.15

      - name: Build unsigned macOS artifacts
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: >-
          npm run tauri -- build
          --target ${{ matrix.target }}
          --bundles dmg,app
          --ci
          --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.app.tar.gz' \) -print -exec cp {} artifacts/ \;
          find artifacts -maxdepth 1 -type f -print

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: OpenMindAI-3.0.1-macos-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error
