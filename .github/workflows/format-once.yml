name: Format Once

on:
  push:
    paths:
      - .github/format-now.trigger

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "style(rust): apply cargo fmt"
          git push origin HEAD:main
