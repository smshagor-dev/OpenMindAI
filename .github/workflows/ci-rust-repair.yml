name: One-shot Rust CI Repair

on:
  push:
    branches:
      - fix/ci-rust-validation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ci-rust-validation

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply minimal Rust fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agent = Path('src-tauri/src/local_agent.rs')
          text = agent.read_text()

          replacements = [
              ('    time::{Duration, Instant},\n', '    time::Duration,\n'),
              ('\nuse chrono::Utc;\n', '\n'),
              (
                  '    run_agent_message(&app, &state, &conversation_id, &user.content, Some(user)).await\n',
                  '    let content = user.content.clone();\n    run_agent_message(&app, &state, &conversation_id, &content, Some(user)).await\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected local_agent.rs anchor not found: {old!r}')
              text = text.replace(old, new, 1)
          agent.write_text(text)

          workspace = Path('src-tauri/src/local_workspace.rs')
          text = workspace.read_text()
          old = "fn lock_database(state: &State<AppState>) -> Result<std::sync::MutexGuard<'_, Database>, AppError> {"
          new = "fn lock_database<'a, 'r>(state: &'a State<'r, AppState>) -> Result<std::sync::MutexGuard<'a, Database>, AppError> {"
          if old not in text:
              raise SystemExit('Expected local_workspace.rs lock_database anchor not found')
          workspace.write_text(text.replace(old, new, 1))
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Commit repaired sources and remove helper
        shell: bash
        run: |
          rm .github/workflows/ci-rust-repair.yml
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/src/local_agent.rs src-tauri/src/local_workspace.rs .github/workflows/ci-rust-repair.yml
          git diff --cached --check
          git commit -m "fix(ci): restore Rust validation and Tauri build"
          git push origin HEAD:fix/ci-rust-validation
