name: LSP Call Hierarchy Integration

on:
  push:
    branches:
      - work/lsp-call-hierarchy

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  integrate-and-verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply call hierarchy integration
        run: python scripts/apply_lsp_call_hierarchy.py

      - name: Remove one-shot integration files
        run: rm scripts/apply_lsp_call_hierarchy.py .github/workflows/lsp-call-hierarchy.yml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format generated Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Focused LSP tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml coding_lsp::tests

      - name: Security policy tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml openagent_security::tests

      - name: Full Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Deterministic coding evaluation
        run: python scripts/coding_workspace_eval.py

      - name: Adversarial security evaluation
        run: python scripts/coding_security_suite.py

      - name: Remove generated Python caches
        run: find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Diff safety
        run: git diff --check

      - name: Commit verified call hierarchy implementation
        env:
          BRANCH: work/lsp-call-hierarchy
        run: |
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bounded LSP call hierarchy"
          git push origin "HEAD:${BRANCH}"
