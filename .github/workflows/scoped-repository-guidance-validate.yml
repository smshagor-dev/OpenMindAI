name: Scoped repository guidance repair

on:
  push:
    branches: [fix/scoped-guidance-ci]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fix scoped guidance selection
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/openagent_context.rs')
          source = path.read_text()

          old = '''            let term_hits = terms
                .iter()
                .filter(|term| normalized_scope.contains(term.as_str()))
                .count();
            let score = relevant_hits * 1_000 + term_hits * 100 + metadata.precedence;
            Some((score, metadata.relative, path.clone()))
'''
          new = '''            let term_hits = terms
                .iter()
                .filter(|term| normalized_scope.contains(term.as_str()))
                .count();
            if relevant_hits == 0 && term_hits == 0 {
                return None;
            }
            let score = relevant_hits * 1_000 + term_hits * 100 + metadata.precedence;
            Some((score, metadata.relative, path.clone()))
'''
          if source.count(old) != 1:
              raise SystemExit(f'scoped selection anchor count={source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''        .filter(|path| !instruction_set.contains(path) && safe_context_file(path))
'''
          new = '''        .filter(|path| {
            !instruction_set.contains(path)
                && !guidance_like_file(root, path)
                && safe_context_file(path)
        })
'''
          if source.count(old) != 1:
              raise SystemExit(f'relevant filter anchor count={source.count(old)}')
          source = source.replace(old, new, 1)

          anchor = '''fn instruction_metadata(root: &Path, path: &Path) -> Option<InstructionMetadata> {
'''
          helper = '''fn guidance_like_file(root: &Path, path: &Path) -> bool {
    let relative = normalized_relative(root, path);
    relative == "AGENTS.md"
        || relative.ends_with("/AGENTS.md")
        || relative == "CLAUDE.md"
        || relative.ends_with("/CLAUDE.md")
        || relative == "CONTRIBUTING.md"
        || relative.ends_with("/CONTRIBUTING.md")
        || relative == ".github/copilot-instructions.md"
        || relative.ends_with("/.github/copilot-instructions.md")
}

'''
          if source.count(anchor) != 1:
              raise SystemExit(f'helper anchor count={source.count(anchor)}')
          source = source.replace(anchor, helper + anchor, 1)

          anchor = '''    #[test]
    fn context_does_not_follow_symlinked_files_or_guidance() {
'''
          test = '''    #[test]
    fn unrelated_scoped_guidance_does_not_leak_into_context() {
        let temp = tempfile::tempdir().unwrap();
        fs::write(temp.path().join("AGENTS.md"), "ROOT_RULE").unwrap();
        fs::create_dir_all(temp.path().join("src/auth")).unwrap();
        fs::create_dir_all(temp.path().join("docs")).unwrap();
        fs::create_dir_all(temp.path().join("tools")).unwrap();
        fs::write(temp.path().join("src/AGENTS.md"), "SRC_RULE").unwrap();
        fs::write(temp.path().join("src/auth/AGENTS.md"), "AUTH_RULE").unwrap();
        fs::write(temp.path().join("docs/AGENTS.md"), "DOCS_ONLY_RULE").unwrap();
        fs::write(temp.path().join("tools/AGENTS.md"), "TOOLS_ONLY_RULE").unwrap();
        fs::write(temp.path().join("docs/CLAUDE.md"), "DOCS_CLAUDE_RULE").unwrap();
        fs::write(
            temp.path().join("src/auth/session.rs"),
            "fn auth_session_refresh() {}",
        )
        .unwrap();

        let context = build_repository_context(
            &[("root".to_string(), temp.path().display().to_string())],
            "fix auth session refresh",
        )
        .unwrap();

        assert!(context.contains("ROOT_RULE"));
        assert!(context.contains("SRC_RULE"));
        assert!(context.contains("AUTH_RULE"));
        assert!(!context.contains("DOCS_ONLY_RULE"));
        assert!(!context.contains("TOOLS_ONLY_RULE"));
        assert!(!context.contains("DOCS_CLAUDE_RULE"));
    }

'''
          if source.count(anchor) != 1:
              raise SystemExit(f'test anchor count={source.count(anchor)}')
          source = source.replace(anchor, test + anchor, 1)

          path.write_text(source)
          PY
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Repository context tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml openagent_context -- --nocapture
      - name: Diff check
        run: git diff --check
      - name: Remove temporary repair workflow
        run: rm .github/workflows/scoped-repository-guidance-validate.yml
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/openagent_context.rs .github/workflows/scoped-repository-guidance-validate.yml
          git commit -m 'fix: harden scoped repository guidance selection'
          git push origin HEAD:fix/scoped-guidance-ci
