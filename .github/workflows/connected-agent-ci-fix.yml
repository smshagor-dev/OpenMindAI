name: Connected Agent CI Fix

on:
  push:
    branches:
      - fix/connected-agent-ci-green

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Refactor connected agent and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src-tauri/src/connected_agent.rs')
          text = path.read_text()

          old_model = 'model: &crate::models::ModelRecord,'
          new_model = 'model: &crate::model_registry::ModelRecord,'
          assert text.count(old_model) == 1, f'model ref occurrences: {text.count(old_model)}'
          text = text.replace(old_model, new_model, 1)

          signature_pattern = re.compile(
              r'async fn request_agent_decision\(\s*'
              r'client: &reqwest::Client,\s*'
              r'endpoint: &str,\s*'
              r'goal: &str,\s*'
              r'action_catalog: &\[ConnectedActionDefinition\],\s*'
              r'recent_chat: &str,\s*'
              r'project_context: &str,\s*'
              r'transcript: &VecDeque<String>,\s*'
              r'step: usize,\s*'
              r'allow_tools: bool,\s*'
              r'\) -> Result<Value, AppError> \{'
          )
          signature_replacement = '''struct AgentDecisionRequest<'a> {
              endpoint: &'a str,
              goal: &'a str,
              action_catalog: &'a [ConnectedActionDefinition],
              recent_chat: &'a str,
              project_context: &'a str,
              transcript: &'a VecDeque<String>,
              step: usize,
              allow_tools: bool,
          }

          async fn request_agent_decision(
              client: &reqwest::Client,
              request: AgentDecisionRequest<'_>,
          ) -> Result<Value, AppError> {
              let AgentDecisionRequest {
                  endpoint,
                  goal,
                  action_catalog,
                  recent_chat,
                  project_context,
                  transcript,
                  step,
                  allow_tools,
              } = request;'''
          text, count = signature_pattern.subn(signature_replacement, text, count=1)
          assert count == 1, f'signature replacements: {count}'

          approved_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)let decision = request_agent_decision\(\s*'
              r'&state\.http,\s*'
              r'&endpoint,\s*'
              r'content,\s*'
              r'action_catalog,\s*'
              r'&conversation_context\(state, conversation_id\)\?,\s*'
              r'&project_context\(state, conversation_id\)\?,\s*'
              r'&transcript,\s*'
              r'0,\s*'
              r'false,\s*'
              r'\)\s*\.await\?;'
          )
          def replace_approved(match):
              i = match.group('indent')
              return f'''{i}let recent_chat = conversation_context(state, conversation_id)?;
          {i}let project = project_context(state, conversation_id)?;
          {i}let decision = request_agent_decision(
          {i}    &state.http,
          {i}    AgentDecisionRequest {{
          {i}        endpoint: &endpoint,
          {i}        goal: content,
          {i}        action_catalog,
          {i}        recent_chat: &recent_chat,
          {i}        project_context: &project,
          {i}        transcript: &transcript,
          {i}        step: 0,
          {i}        allow_tools: false,
          {i}    }},
          {i})
          {i}.await?;'''
          text, count = approved_pattern.subn(replace_approved, text, count=1)
          assert count == 1, f'approved call replacements: {count}'

          loop_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)result = request_agent_decision\(\s*'
              r'&state\.http,\s*'
              r'&endpoint,\s*'
              r'content,\s*'
              r'action_catalog,\s*'
              r'&recent_chat,\s*'
              r'&project,\s*'
              r'&transcript,\s*'
              r'step,\s*'
              r'true,\s*'
              r'\) => result\?,'
          )
          def replace_loop(match):
              i = match.group('indent')
              return f'''{i}result = request_agent_decision(
          {i}    &state.http,
          {i}    AgentDecisionRequest {{
          {i}        endpoint: &endpoint,
          {i}        goal: content,
          {i}        action_catalog,
          {i}        recent_chat: &recent_chat,
          {i}        project_context: &project,
          {i}        transcript: &transcript,
          {i}        step,
          {i}        allow_tools: true,
          {i}    }},
          {i}) => result?,'''
          text, count = loop_pattern.subn(replace_loop, text, count=1)
          assert count == 1, f'loop call replacements: {count}'

          path.write_text(text)
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
      - name: Commit validated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/connected_agent.rs
          git commit -m 'fix(agent): satisfy strict connected-app CI'
          git push origin HEAD:fix/connected-agent-ci-green
