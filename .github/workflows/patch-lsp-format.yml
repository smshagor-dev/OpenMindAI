name: Patch LSP Format Repair

on:
  push:
    branches:
      - work/patch-lsp-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/patch-lsp-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact Rust formatter output
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-lsp-format.yml
      - name: Commit formatter repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/coding_lsp.rs src-tauri/src/coding_patch.rs .github/workflows/patch-lsp-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply Rust formatting to patch and LSP hardening"
          git push origin HEAD:work/patch-lsp-hardening
