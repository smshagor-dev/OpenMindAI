name: Refresh Rust baseline

on:
  push:
    branches:
      - production-readiness-completion
    paths:
      - .github/workflows/refresh-rust-baseline.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: production-readiness-completion

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Refresh vulnerable h2 and dependency lock
        run: cargo update --manifest-path src-tauri/Cargo.toml -p h2 --precise 0.4.16

      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock src-tauri/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh Rust security baseline"
          git push origin HEAD:production-readiness-completion
