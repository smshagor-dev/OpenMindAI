name: PR214 Test Repair

on:
  push:
    branches:
      - work/patch-lsp-hardening

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/patch-lsp-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Repair cross-platform path scoping and hash precondition parsing
        shell: python
        run: |
          from pathlib import Path

          lsp = Path('src-tauri/src/coding_lsp.rs')
          text = lsp.read_text()
          old = '''fn sanitize_lsp_result(root: &Path, result: Value, limit: usize) -> Result<Value, AppError> {
              match result {'''
          new = '''fn sanitize_lsp_result(root: &Path, result: Value, limit: usize) -> Result<Value, AppError> {
              let root = fs::canonicalize(root)?;
              match result {'''
          if text.count(old) != 1:
              raise SystemExit('sanitize_lsp_result insertion point mismatch')
          text = text.replace(old, new, 1)
          lsp.write_text(text)

          patch = Path('src-tauri/src/coding_patch.rs')
          text = patch.read_text()

          old = '''        #[serde(default)]
                  expected_sha256: Option<String>,'''
          new = '''        #[serde(default, rename = "expectedSha256", alias = "expected_sha256")]
                  expected_sha256: Option<String>,'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two SHA field annotations, found {count}')
          text = text.replace(old, new)

          old = '''fn resolve_scoped_target(root: &Path, relative: &Path) -> Result<PathBuf, AppError> {
              ensure_no_symlink_components(root, relative)?;
              let target = root.join(relative);
              let security_path = if target.exists() {
                  fs::canonicalize(&target)?
              } else {
                  canonical_existing_parent(&target)?
              };
              if !security_path.starts_with(root) {'''
          new = '''fn resolve_scoped_target(root: &Path, relative: &Path) -> Result<PathBuf, AppError> {
              ensure_no_symlink_components(root, relative)?;
              let canonical_root = fs::canonicalize(root)?;
              let target = root.join(relative);
              let security_path = if target.exists() {
                  fs::canonicalize(&target)?
              } else {
                  canonical_existing_parent(&target)?
              };
              if !security_path.starts_with(&canonical_root) {'''
          if text.count(old) != 1:
              raise SystemExit('resolve_scoped_target insertion point mismatch')
          text = text.replace(old, new, 1)
          patch.write_text(text)
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Validate focused regression tests
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml coding_lsp::tests::lsp_results_are_scoped_to_workspace -- --exact
          cargo test --locked --manifest-path src-tauri/Cargo.toml coding_patch::tests::interrupted_recovery_restores_backup -- --exact
          cargo test --locked --manifest-path src-tauri/Cargo.toml coding_patch::tests::stale_hash_precondition_blocks_transaction -- --exact
      - name: Validate strict Clippy and complete Rust suite
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Remove one-shot workflow
        run: rm .github/workflows/pr214-test-repair.yml
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/coding_lsp.rs src-tauri/src/coding_patch.rs .github/workflows/pr214-test-repair.yml
          git commit -m "fix: harden cross-platform patch and LSP validation"
          git push origin HEAD:work/patch-lsp-hardening
