name: Apply local image generation runtime

on:
  push:
    branches:
      - local-image-generation-runtime

permissions:
  contents: write

concurrency:
  group: local-image-generation-runtime
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply production image runtime patch
        run: python scripts/apply_local_image_generation_runtime.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust strict clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Validate production diff hygiene
        run: |
          git diff --check
          git checkout origin/main -- src-tauri/gen/schemas src-tauri/capabilities/default.json
          rm .github/workflows/apply-local-image-generation-runtime.yml
          rm scripts/apply_local_image_generation_runtime.py
          test -f src-tauri/src/diffusion_runtime.rs
          ! grep -R "generation_preview_svg" -n src-tauri/src/lib.rs
          grep -q '"image" => "image/png"' src-tauri/src/artifacts.rs
          grep -q 'stable-diffusion.cpp' src-tauri/model-catalog.json

      - name: Commit validated source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Add real local image generation runtime"
          git push origin HEAD:local-image-generation-runtime
