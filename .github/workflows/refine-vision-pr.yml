name: Refine vision integration before merge

on:
  push:
    branches:
      - vision-model-package-integration

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: vision-model-package-integration
          fetch-depth: 0

      - name: Restore frontend files and apply focused changes
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:src/App.tsx > src/App.tsx
          git show origin/main:src/lib/chat.ts > src/lib/chat.ts
          python - <<'PY'
          from pathlib import Path

          chat = Path("src/lib/chat.ts")
          text = chat.read_text(encoding="utf-8")
          interface_anchor = '''export interface AttachmentDraft {
            id: string;
            name: string;
            size: number;
            type: string;
            kind: "text" | "image" | "pdf" | "binary";
            contentPreview: string | null;
          }
          '''
          image_support = interface_anchor + '''
          const MAX_VISION_IMAGE_INPUT_BYTES = 16 * 1024 * 1024;
          const MAX_VISION_IMAGE_DATA_URL_CHARS = 6_000_000;
          const MAX_VISION_IMAGE_DIMENSION = 2048;
          const SUPPORTED_VISION_IMAGE_TYPES = new Set(["image/jpeg", "image/png", "image/webp"]);

          function visionMimeType(file: File) {
            const declared = file.type.toLowerCase();
            if (SUPPORTED_VISION_IMAGE_TYPES.has(declared)) return declared;
            if (/\\.png$/i.test(file.name)) return "image/png";
            if (/\\.jpe?g$/i.test(file.name)) return "image/jpeg";
            if (/\\.webp$/i.test(file.name)) return "image/webp";
            return null;
          }

          async function encodeVisionImage(file: File) {
            const mimeType = visionMimeType(file);
            if (!mimeType) {
              throw new Error("OpenMindAI Lens currently accepts PNG, JPEG, and WebP images.");
            }
            if (file.size > MAX_VISION_IMAGE_INPUT_BYTES) {
              throw new Error("Image is too large for local vision. Use an image smaller than 16 MB.");
            }

            const objectUrl = window.URL.createObjectURL(file);
            try {
              const image = document.createElement("img");
              await new Promise<void>((resolve, reject) => {
                image.onload = () => resolve();
                image.onerror = () => reject(new Error("Could not decode the selected image."));
                image.src = objectUrl;
              });

              const scale = Math.min(
                1,
                MAX_VISION_IMAGE_DIMENSION / Math.max(image.naturalWidth, image.naturalHeight, 1),
              );
              const width = Math.max(1, Math.round(image.naturalWidth * scale));
              const height = Math.max(1, Math.round(image.naturalHeight * scale));
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const context = canvas.getContext("2d");
              if (!context) throw new Error("Could not prepare the image for local vision.");
              context.drawImage(image, 0, 0, width, height);

              let dataUrl =
                mimeType === "image/png"
                  ? canvas.toDataURL("image/png")
                  : canvas.toDataURL("image/jpeg", 0.88);

              if (dataUrl.length > MAX_VISION_IMAGE_DATA_URL_CHARS) {
                const flattened = document.createElement("canvas");
                flattened.width = width;
                flattened.height = height;
                const flattenedContext = flattened.getContext("2d");
                if (!flattenedContext) throw new Error("Could not compress the image for local vision.");
                flattenedContext.fillStyle = "#ffffff";
                flattenedContext.fillRect(0, 0, width, height);
                flattenedContext.drawImage(canvas, 0, 0);
                dataUrl = flattened.toDataURL("image/jpeg", 0.82);
              }

              if (dataUrl.length > MAX_VISION_IMAGE_DATA_URL_CHARS) {
                throw new Error("Image remains too large after local optimization. Resize it and try again.");
              }

              const safeName = file.name.split("]").join(" ").replace(/[\\r\\n]/g, " ");
              return `![${safeName}](${dataUrl})`;
            } finally {
              window.URL.revokeObjectURL(objectUrl);
            }
          }
          '''
          if interface_anchor not in text:
            raise SystemExit("AttachmentDraft anchor not found")
          text = text.replace(interface_anchor, image_support, 1)
          old_image = '''  } else if (kind === "image") {
            contentPreview = `[Image attached: ${file.name}. Exact visual analysis requires the local OpenMindAI Lens vision runtime. Do not infer unseen image content from metadata alone.]`;
          } else if (kind === "pdf") {'''
          new_image = '''  } else if (kind === "image") {
            contentPreview = await encodeVisionImage(file);
          } else if (kind === "pdf") {'''
          if old_image not in text:
            raise SystemExit("image attachment anchor not found")
          text = text.replace(old_image, new_image, 1)
          old_kind = '''export function attachmentKind(file: File): AttachmentDraft["kind"] {
            if (file.type.startsWith("image/")) return "image";'''
          new_kind = '''export function attachmentKind(file: File): AttachmentDraft["kind"] {
            if (file.type.startsWith("image/") || /\\.(png|jpe?g|webp)$/i.test(file.name)) return "image";'''
          if old_kind not in text:
            raise SystemExit("attachmentKind anchor not found")
          text = text.replace(old_kind, new_kind, 1)
          chat.write_text(text, encoding="utf-8")

          app = Path("src/App.tsx")
          text = app.read_text(encoding="utf-8")
          old_add = '''  async function addFiles(files: FileList | null) {
            if (!files) return;
            const next = await Promise.all(Array.from(files).map(readAttachment));
            setAttachments((items) => [...items, ...next]);
            setView("chat");
            composerRef.current?.focus();
          }
          '''
          new_add = '''  async function addFiles(files: FileList | null) {
            if (!files) return;
            try {
              const next = await Promise.all(Array.from(files).map(readAttachment));
              setAttachments((items) => [...items, ...next]);
              setView("chat");
              composerRef.current?.focus();
            } catch (caught) {
              showError(caught);
            }
          }
          '''
          if old_add not in text:
            raise SystemExit("addFiles anchor not found")
          app.write_text(text.replace(old_add, new_add, 1), encoding="utf-8")

          inference = Path("src-tauri/src/inference.rs")
          text = inference.read_text(encoding="utf-8")
          old_prepare = '''    let mut prepared = Vec::with_capacity(messages.len());
              for message in messages {
                  let (text, images) = extract_inline_data_images(&message.content)?;
                  prepared.push((message, text, images));
              }
          '''
          new_prepare = '''    let mut prepared = Vec::with_capacity(messages.len());
              for message in messages {
                  let (text, images) = if message.role == "user" {
                      extract_inline_data_images(&message.content)?
                  } else {
                      (message.content.clone(), Vec::new())
                  };
                  prepared.push((message, text, images));
              }
          '''
          if old_prepare not in text:
            raise SystemExit("build_context image parsing anchor not found")
          inference.write_text(text.replace(old_prepare, new_prepare, 1), encoding="utf-8")
          PY

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Format and validate Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Remove one-off workflow
        run: rm .github/workflows/refine-vision-pr.yml

      - name: Commit focused validated diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refine multimodal vision integration"
          git push origin HEAD:vision-model-package-integration
