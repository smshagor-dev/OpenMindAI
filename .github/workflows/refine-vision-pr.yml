name: Refine vision integration before merge

on:
  push:
    branches:
      - vision-model-package-integration

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: vision-model-package-integration
          fetch-depth: 0

      - name: Apply focused vision refinement
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:src/App.tsx > src/App.tsx
          git show origin/main:src/lib/chat.ts > src/lib/chat.ts
          python scripts/refine_vision_integration.py

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Format and validate Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Remove one-off refinement helpers
        run: |
          rm .github/workflows/refine-vision-pr.yml
          rm scripts/refine_vision_integration.py

      - name: Commit focused validated diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refine multimodal vision integration"
          git push origin HEAD:vision-model-package-integration
