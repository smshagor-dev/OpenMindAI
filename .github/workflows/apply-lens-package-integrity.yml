name: Apply Lens package integrity hardening

on:
  push:
    branches:
      - lens-package-integrity
    paths:
      - .github/workflows/apply-lens-package-integrity.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: lens-package-integrity
          fetch-depth: 0

      - name: Apply Lens integrity patch
        run: python scripts/apply_lens_package_integrity.py

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Validate Lens integrity invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          package = Path('src-tauri/src/model_package.rs').read_text(encoding='utf-8')
          registry = Path('src-tauri/src/model_registry.rs').read_text(encoding='utf-8')
          required = [
              'validate_installed_dependencies',
              'package-manifest.json',
              'record.actual_sha256',
              'sha256_file(&file_path)',
              'verify_hashes',
              'Filename existence alone is intentionally insufficient now.',
              'package dependency integrity check failed',
          ]
          joined = package + '\n' + registry
          missing = [item for item in required if item not in joined]
          if missing:
              raise SystemExit(f'missing Lens integrity invariants: {missing}')
          if 'directory_contains_matching_file' in registry:
              raise SystemExit('legacy filename-only dependency readiness helper remains')
          PY

      - name: Remove one-off helper files
        run: |
          rm -f .github/workflows/apply-lens-package-integrity.yml
          rm -f scripts/apply_lens_package_integrity.py

      - name: Commit validated production source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Verify Lens package integrity"
          git push origin HEAD:lens-package-integrity
