name: Rustfmt Connected Agent

on:
  push:
    branches:
      - fix/rustfmt-connected-agent

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Commit formatting
        run: |
          rm .github/workflows/_rustfmt-connected-agent.yml
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/src .github/workflows/_rustfmt-connected-agent.yml
          git commit -m "style(rust): format connected app agent"
          git push origin HEAD:fix/rustfmt-connected-agent
