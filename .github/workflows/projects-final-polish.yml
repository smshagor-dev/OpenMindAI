name: Projects Final Polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/projects-final-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Apply final project polish and remove helper
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/ProjectsWorkspace.tsx")
          text = path.read_text()

          def replace_once(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"could not apply {label}")

          replace_once(
              r'(await refreshProjects\(project\.id\)\.catch\(\(caught\) => setError\(formatError\(caught\)\)\);\n\s*)(setDraftName\(""\);)',
              r'\1setSavedAt(null);\n    \2',
              "new-project saved state reset",
          )
          replace_once(
              r'(setActiveId\(project\.id\);\n\s*setLinkSearch\(""\);\n)(\s*setError\(null\);)',
              r'\1                  setSavedAt(null);\n\2',
              "project-switch saved state reset",
          )
          replace_once(
              r'if \(deleted\) setDeleteTarget\(null\);',
              'if (deleted) {\n      setSavedAt(null);\n      setDeleteTarget(null);\n    }',
              "delete-project saved state reset",
          )
          replace_once(
              r'const text = await file\.text\(\);\n\s*const trimmed = Array\.from\(text\)\.slice\(0, MAX_PROJECT_FILE_TEXT_CHARS\)\.join\(""\);\n\s*return \{\n\s*contentText: trimmed,\n\s*status: "ready",\n\s*error: text\.length > trimmed\.length \? "Ready for context\. Stored preview was truncated\." : null,\n\s*\};',
              'const text = await file.text();\n    const characters = Array.from(text);\n    const truncated = characters.length > MAX_PROJECT_FILE_TEXT_CHARS;\n    const trimmed = characters.slice(0, MAX_PROJECT_FILE_TEXT_CHARS).join("");\n    return {\n      contentText: trimmed,\n      status: "ready",\n      error: truncated ? "Ready for context. Stored preview was truncated." : null,\n    };',
              "Unicode-safe truncation status",
          )

          path.write_text(text)
          Path(".github/workflows/projects-final-polish.yml").unlink()
      - name: Commit final project polish
        shell: bash
        run: |
          git config user.name openmindai-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "fix(projects): finish workspace polish"
          git push origin HEAD:main
