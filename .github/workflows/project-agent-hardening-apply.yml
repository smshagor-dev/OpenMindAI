name: Project Agent Hardening Apply

on:
  push:
    branches:
      - feature/project-agent-production-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/project-agent-production-hardening
          fetch-depth: 0

      - name: Apply validated agent hardening commits
        run: |
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git cherry-pick ce615303f57decdda06f59c3ab0383f2215aa40e
          git cherry-pick a4fd5201f8fcdf0542efa6b849ebf6eeb3586bc0
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Remove one-shot helper and push
        run: |
          git rm .github/workflows/project-agent-hardening-apply.yml
          git commit -m "chore(ci): remove project agent hardening helper"
          git push origin HEAD:feature/project-agent-production-hardening
