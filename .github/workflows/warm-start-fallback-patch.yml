          from pathlib import Path

          path = Path('src-tauri/src/warm_start.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '"startup model warmup skipped because OpenMindAI Core is not installed"',
              '"startup model warmup skipped because no usable local chat model is installed"',
              'generic no-model warmup log',
          )

          replace_once(
              'prime_local_server(&client, &endpoint).await;',
              'prime_local_server(&client, &endpoint, &model).await;',
              'pass selected model to warmup request',
          )

