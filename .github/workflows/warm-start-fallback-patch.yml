name: Warm Start Fallback Patch

on:
  push:
    branches:
      - fix/warm-start-available-model-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/warm-start-available-model-fallback
          fetch-depth: 1

      - name: Apply available-model fallback
        shell: bash
        run: |
