name: CI

on:
  push:
    branches:
      - main
      - production-readiness-completion
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        run: npm run check:version

      - name: Release and updater configuration
        run: npm run check:release

      - name: Model catalog
        run: npm run check:models

      - name: Lint
        run: npm run lint

      - name: TypeScript and Vite build
        run: npm run build

  rust:
    name: Rust validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # native-cxx-llama intentionally lives in its own workflow because it
      # requires a pinned external llama.cpp build and native linker inputs.
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-app-build:
    name: Windows Tauri application build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build desktop application without bundling
        run: npm run tauri -- build --no-bundle

      - name: Verify application binary
        shell: pwsh
        run: |
          $binary = "src-tauri/target/release/open-mind-ai.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Expected Tauri application binary was not produced: $binary"
          }
          if ((Get-Item -LiteralPath $binary).Length -le 0) {
            throw "Tauri application binary is empty: $binary"
          }
