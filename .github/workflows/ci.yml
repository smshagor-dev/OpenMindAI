name: CI

on:
  push:
    branches:
      - main
      - production-readiness-completion
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-rustfmt:
    name: Apply lifecycle rustfmt
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/android-lifecycle-main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lifecycle branch
        uses: actions/checkout@v7
        with:
          ref: perf/android-lifecycle-main
          fetch-depth: 0

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and push
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/mobile_inference.rs
          git commit -m "style(rust): apply lifecycle rustfmt"
          git push origin HEAD:perf/android-lifecycle-main

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        run: npm run check:version

      - name: Release and updater configuration
        run: npm run check:release

      - name: Lint
        run: npm run lint

      - name: TypeScript and Vite build
        run: npm run build

  rust:
    name: Rust validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features

  windows-app-build:
    name: Windows Tauri application build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build desktop application without bundling
        run: npm run tauri -- build --no-bundle

      - name: Verify application binary
        shell: pwsh
        run: |
          $binary = "src-tauri/target/release/open-mind-ai.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Expected Tauri application binary was not produced: $binary"
          }
          if ((Get-Item -LiteralPath $binary).Length -le 0) {
            throw "Tauri application binary is empty: $binary"
          }
