name: CI

on:
  push:
    branches:
      - main
      - production-readiness-completion
      - fix/rustfmt-runtime-install
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofmt:
    name: One-shot Rust formatting
    if: github.ref == 'refs/heads/fix/rustfmt-runtime-install' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format runtime installer and restore CI workflow
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git checkout HEAD^ -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/runtime_install.rs .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git commit -m "chore: format runtime installer"
          git push origin HEAD:fix/rustfmt-runtime-install
