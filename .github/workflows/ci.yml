name: CI

on:
  push:
    branches:
      - main
      - production-readiness-completion
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        run: npm run check:version

      - name: Release and updater configuration
        run: npm run check:release

      - name: Model catalog
        run: npm run check:models

      - name: Image generation routing
        run: npm run test:image

      - name: Theme contrast and appearance regression
        run: npm run check:theme

      - name: Shared application updater regression
        run: npm run test:updates

      - name: Manual model update policy regression
        run: npm run test:model-updates

      - name: Conversation isolation regression
        run: npm run test:conversations

      - name: Local workspace root and navigation race regression
        run: npm run test:workspace

      - name: Chat draft failure recovery
        run: npm run test:drafts

      - name: PDF ingestion fallback regression
        run: npm run test:pdf
      - name: Regeneration history preservation
        run: npm run test:regeneration
      - name: Model inventory availability
        run: npm run test:model-inventory
      - name: Model action failure recovery
        run: npm run test:model-actions
      - name: Concurrent attachment ingestion
        run: npm run test:attachments
      - name: Attachment context fairness and truncation disclosure
        run: npm run test:attachment-context
      - name: Settings save failure recovery
        run: npm run test:settings-save
      - name: Voice draft ownership
        run: npm run test:voice-drafts
      - name: Composer IME regression
        run: npm run test:ime

      - name: Auto routing and offline regression
        run: npm run test:routing

      - name: Lint
        run: npm run lint

      - name: TypeScript and Vite build
        run: npm run build

  process-ownership:
    name: Runtime ownership (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Runtime ownership format
        run: cargo fmt --manifest-path tests/process-ownership/Cargo.toml -- --check
      - name: Runtime ownership Clippy
        run: cargo clippy --locked --manifest-path tests/process-ownership/Cargo.toml --all-targets -- -D warnings
      - name: Runtime exit, crash and relaunch tests
        run: cargo test --locked --manifest-path tests/process-ownership/Cargo.toml

  sandbox-capture:
    name: Bounded sandbox capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Production module regressions
        run: cargo test --locked --manifest-path tests/sandbox-capture/Cargo.toml

  mcp-response:
    name: MCP response correlation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path tests/mcp-response/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tests/mcp-response/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tests/mcp-response/Cargo.toml

  private-descriptor:
    name: Private session descriptor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Production module regressions
        run: cargo test --locked --manifest-path tests/private-descriptor/Cargo.toml

  oauth-callback:
    name: OAuth callback framing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path tests/oauth-callback/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tests/oauth-callback/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tests/oauth-callback/Cargo.toml

  lockfile:
    name: Cargo lockfile consistency
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve manifest and verify committed Cargo.lock
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
          git diff -- src-tauri/Cargo.lock
          git diff --exit-code -- src-tauri/Cargo.lock

  repository-context:
    name: Bounded repository context (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path tests/repository-context/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tests/repository-context/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tests/repository-context/Cargo.toml -- --nocapture

  rust:
    name: Rust validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # native-cxx-llama intentionally lives in its own workflow because it
      # requires a pinned external llama.cpp build and native linker inputs.
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-app-build:
    name: Windows Tauri application build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build desktop application without bundling
        run: npm run tauri -- build --no-bundle

      - name: Verify application binary
        shell: pwsh
        run: |
          $binary = "src-tauri/target/release/open-mind-ai.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Expected Tauri application binary was not produced: $binary"
          }
          if ((Get-Item -LiteralPath $binary).Length -le 0) {
            throw "Tauri application binary is empty: $binary"
          }
