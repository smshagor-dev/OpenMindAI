name: Context selection compression validation

on:
  push:
    branches: [work/context-selection-compression]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply context selection and compression implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/context-selection-compression-apply.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("old_prompt = '''", "old_prompt = r'''", 1)
          text = text.replace("new_prompt = '''", "new_prompt = r'''", 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 .github/context-selection-compression-apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/openagent_prompt_context.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('project_instructions: &"project instruction ".repeat(600),', 'project_instructions: "project instructions",')
          text = text.replace('workspace_context: &"workspace snapshot ".repeat(600),', 'workspace_context: "workspace snapshot",')
          text = text.replace('conversation_context: &"old chat newest chat ".repeat(600),', 'conversation_context: "recent conversation",')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Repository context tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml openagent_context -- --nocapture
      - name: Prompt context tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml openagent_prompt_context -- --nocapture
      - name: Diff check
        run: git diff --check
      - name: Remove temporary validation files
        run: rm -f .github/workflows/context-selection-compression-validate.yml .github/context-selection-compression.payload .github/context-selection-compression-apply.py
      - name: Commit validated context selection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src-tauri/src/openagent_context.rs src-tauri/src/openagent_prompt_context.rs src-tauri/src/local_agent.rs src-tauri/src/lib.rs .github/workflows/context-selection-compression-validate.yml .github/context-selection-compression.payload .github/context-selection-compression-apply.py
          git commit -m 'feat: add model-aware context selection and compression'
          git push origin HEAD:work/context-selection-compression
