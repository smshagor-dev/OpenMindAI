name: Apply vision media privacy hardening

on:
  push:
    branches:
      - vision-media-privacy-hardening
    paths:
      - scripts/apply_vision_media_privacy_hardening.py
      - scripts/fix_vision_regeneration_guard.py
      - .github/workflows/apply-vision-media-privacy-hardening.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: vision-media-privacy-hardening
          fetch-depth: 0

      - name: Apply ephemeral vision media patch
        run: |
          python scripts/apply_vision_media_privacy_hardening.py
          python scripts/fix_vision_regeneration_guard.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Format frontend
        run: npx prettier --write src/lib/chat.ts src/api.ts src/App.tsx

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Validate media privacy invariants
        run: |
          grep -q 'mediaDataUrl' src/lib/chat.ts
          grep -q 'attachmentMedia' src/lib/chat.ts
          grep -q 'InferenceMedia' src-tauri/src/inference.rs
          grep -q 'vision mode requires an attached image' src-tauri/src/lib.rs
          if grep -q 'return `!\[' src/lib/chat.ts; then
            echo 'Inline image data is still being persisted in chat content'
            exit 1
          fi
          git diff --check

      - name: Remove one-off and stale patch helpers
        run: |
          rm -f .github/workflows/apply-vision-media-pipeline.yml
          rm -f scripts/apply_vision_media_pipeline.py
          rm -f .github/workflows/apply-vision-media-privacy-hardening.yml
          rm -f scripts/apply_vision_media_privacy_hardening.py
          rm -f scripts/fix_vision_regeneration_guard.py

      - name: Commit validated production source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/chat.ts src/api.ts src/App.tsx src-tauri/src/inference.rs src-tauri/src/lib.rs
          git add -A .github/workflows/apply-vision-media-pipeline.yml scripts/apply_vision_media_pipeline.py
          git add -A .github/workflows/apply-vision-media-privacy-hardening.yml scripts/apply_vision_media_privacy_hardening.py scripts/fix_vision_regeneration_guard.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Keep vision media ephemeral"
          git push origin HEAD:vision-media-privacy-hardening
