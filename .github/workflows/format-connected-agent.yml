name: Connected Agent Formatter

on:
  push:
    branches:
      - connected-agent-stabilization

permissions:
  contents: write

concurrency:
  group: connected-agent-formatter
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: connected-agent-stabilization
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/google_workspace.rs src-tauri/src/github_workspace.rs
          git commit -m "style(connectors): apply rustfmt"
          git push origin HEAD:connected-agent-stabilization
