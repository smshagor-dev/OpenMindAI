name: Patch Durability Apply

on:
  push:
    branches:
      - work/patch-durability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/patch-durability
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply durability hardening
        shell: python
        run: |
          from pathlib import Path

          path = Path("src-tauri/src/coding_patch.rs")
          text = path.read_text()

          replacements = {
              "fs::rename(&change.target, &backup)?;": "durable_rename(&change.target, &backup)?;",
              "fs::rename(stage, &change.target)?;": "durable_rename(&stage, &change.target)?;",
              "fs::rename(&backup, &target)?;": "durable_rename(&backup, &target)?;",
              "fs::rename(&temp, path)?;": "durable_rename(&temp, path)?;",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {text.count(old)}")
              text = text.replace(old, new, 1)

          marker = "fn write_synced_json_atomic(path: &Path, value: &impl Serialize) -> Result<(), AppError> {"
          if text.count(marker) != 1:
              raise SystemExit("write_synced_json_atomic marker not unique")

          helper = r'''#[cfg(unix)]
          fn sync_directory(path: &Path) -> Result<(), AppError> {
              fs::File::open(path)?.sync_all()?;
              Ok(())
          }

          #[cfg(not(unix))]
          fn sync_directory(_path: &Path) -> Result<(), AppError> {
              Ok(())
          }

          fn durable_rename(source: &Path, target: &Path) -> Result<(), AppError> {
              let source_parent = source
                  .parent()
                  .ok_or_else(|| AppError::internal("transaction source has no parent directory"))?
                  .to_path_buf();
              let target_parent = target
                  .parent()
                  .ok_or_else(|| AppError::internal("transaction target has no parent directory"))?
                  .to_path_buf();

              fs::rename(source, target)?;
              sync_directory(&source_parent)?;
              if source_parent != target_parent {
                  sync_directory(&target_parent)?;
              }
              Ok(())
          }

          '''
          text = text.replace(marker, helper + marker, 1)

          test_marker = "    #[test]\n    fn transaction_replaces_multiple_files_and_creates_one() {"
          if text.count(test_marker) != 1:
              raise SystemExit("test insertion marker not unique")

          test = r'''    #[test]
              fn durable_rename_moves_file_and_preserves_contents() {
                  let temp = tempfile::tempdir().unwrap();
                  let source = temp.path().join("source.txt");
                  let target = temp.path().join("target.txt");
                  fs::write(&source, "durable").unwrap();
                  durable_rename(&source, &target).unwrap();
                  assert!(!source.exists());
                  assert_eq!(fs::read_to_string(target).unwrap(), "durable");
              }

          '''
          text = text.replace(test_marker, test + test_marker, 1)
          path.write_text(text)

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Patch tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml coding_patch

      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-durability-apply.yml

      - name: Commit durability hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/coding_patch.rs .github/workflows/patch-durability-apply.yml
          git diff --cached --check
          git commit -m "fix: make patch renames filesystem durable"
          git push origin HEAD:work/patch-durability
