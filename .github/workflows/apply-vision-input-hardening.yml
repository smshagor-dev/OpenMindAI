name: Apply vision input hardening final

on:
  push:
    branches:
      - vision-input-hardening-final

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: vision-input-hardening-final
          fetch-depth: 0

      - name: Apply focused hardening
        run: python scripts/apply_vision_input_hardening.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Restore generated schemas and remove helpers
        run: |
          git fetch origin main
          git restore --source=origin/main -- src-tauri/gen/schemas
          git clean -f src-tauri/gen/schemas
          rm .github/workflows/apply-vision-input-hardening.yml
          rm scripts/apply_vision_input_hardening.py

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden local vision image input handling"
          git push origin HEAD:vision-input-hardening-final
