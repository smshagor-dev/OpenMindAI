name: Runtime Cfg Repair

on:
  push:
    branches:
      - work/runtime-guards-v2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply platform scoping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/runtime_guards.rs')
          text = path.read_text(encoding='utf-8')
          for name in ['ISOLATED_MEMORY_BYTES', 'ISOLATED_OPEN_FILES', 'ISOLATED_PROCESSES', 'ISOLATED_FILE_BYTES']:
              text = text.replace(f'const {name}:', f'#[cfg(unix)]\nconst {name}:', 1)
          text = text.replace(
              'pub fn apply_isolated_limits(command: &mut Command, timeout_secs: u64) -> Result<(), AppError> {\n    #[cfg(unix)]\n    {\n',
              '#[cfg(unix)]\npub fn apply_isolated_limits(command: &mut Command, timeout_secs: u64) -> Result<(), AppError> {\n    {\n',
              1,
          )
          text = text.replace(
              '    }\n    #[cfg(not(unix))]\n    {\n        let _ = (command, timeout_secs);\n    }\n    Ok(())\n}\n\n#[cfg(target_os = "linux")]\nunsafe fn set_limit',
              '    }\n    Ok(())\n}\n\n#[cfg(target_os = "linux")]\nunsafe fn set_limit',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove bootstrap workflow
        run: rm -f .github/workflows/runtime-cfg-repair.yml
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf bubblewrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate Linux source
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Commit repair
        run: |
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: scope runtime limits by platform"
          git push origin HEAD:work/runtime-guards-v2
