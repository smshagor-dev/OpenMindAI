name: Release Readiness

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_CPP_COMMIT: 7798007a29a90e3053e799394da48cf53a2f8e0f

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate synchronized version
        run: npm run check:version

      - name: Validate updater and release contract
        run: npm run check:release

      - name: Validate bootstrap shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n OpenMindAI-Setup.command
          bash -n openmindai-setup.sh
          bash -n bootstrap/linux/bootstrap.sh
          bash -n bootstrap/macos/bootstrap.sh

  windows-nsis-smoke:
    name: Windows NSIS native install and v2 upgrade smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v7
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_CPP_COMMIT }}
          path: vendor/llama.cpp
          fetch-depth: 1

      - name: Cache pinned llama.cpp Windows CPU build
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: vendor/llama.cpp/build
          key: llama-${{ runner.os }}-${{ env.LLAMA_CPP_COMMIT }}-cpu-shared-v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build pinned llama.cpp Windows shared CPU runtime
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build `
            -DGGML_CUDA=OFF `
            -DGGML_NATIVE=OFF `
            -DBUILD_SHARED_LIBS=ON `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TOOLS=OFF
          cmake --build vendor/llama.cpp/build --config Release --target llama -j 2

      - name: Stage ABI-locked native runtime
        shell: pwsh
        run: |
          $llamaDll = Get-ChildItem -LiteralPath "vendor/llama.cpp/build" -Filter "llama.dll" -File -Recurse |
            Sort-Object FullName |
            Select-Object -First 1
          if ($null -eq $llamaDll) {
            throw "Unable to locate llama.dll in pinned llama.cpp build"
          }
          $libDir = $llamaDll.Directory.FullName
          $llamaDir = (Resolve-Path -LiteralPath "vendor/llama.cpp").Path
          & ./scripts/prepare-native-runtime.ps1 `
            -LlamaBuildDir "vendor/llama.cpp/build" `
            -OutputDir "src-tauri/native-runtime/windows-x86_64" `
            -Commit $env:LLAMA_CPP_COMMIT
          "LLAMA_CPP_DIR=$llamaDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLAMA_CPP_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENMINDAI_NATIVE_STRICT_ABI=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENMINDAI_PORTABLE_BUILD=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $libDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build unsigned native NSIS smoke candidate
        shell: pwsh
        run: |
          $config = @{
            bundle = @{
              createUpdaterArtifacts = $false
            }
          } | ConvertTo-Json -Depth 10
          Set-Content -Path "src-tauri/tauri.release-smoke.conf.json" -Value $config -Encoding utf8
          npm run tauri -- build --bundles nsis --features native-cxx-llama `
            --config src-tauri/tauri.release-smoke.conf.json `
            --config src-tauri/tauri.native-windows.conf.json

      - name: Verify clean native install and v2 to v3 upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS smoke installer, found $($installers.Count)."
          }
          $candidate = $installers[0]
          if ($candidate.Length -le 0) {
            throw "NSIS smoke installer is empty."
          }

          function Invoke-SilentInstaller {
            param([string]$InstallerPath, [string]$Destination)
            if (Test-Path -LiteralPath $Destination) {
              Remove-Item -LiteralPath $Destination -Recurse -Force
            }
            $arguments = @('/S', "/D=$Destination")
            $process = Start-Process -FilePath $InstallerPath -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Installer failed with exit code $($process.ExitCode): $InstallerPath"
            }
          }

          function Resolve-InstalledApp {
            param([string]$Destination)
            $candidateExe = Get-ChildItem -LiteralPath $Destination -Filter '*.exe' -File -Recurse |
              Where-Object { $_.Name -notmatch '(?i)uninstall' } |
              Sort-Object Length -Descending |
              Select-Object -First 1
            if ($null -eq $candidateExe) {
              throw "No installed application executable found under $Destination"
            }
            return $candidateExe
          }

          function Assert-InstalledVersion {
            param([string]$Destination, [string]$ExpectedVersion)
            $appExe = Resolve-InstalledApp -Destination $Destination
            $productVersion = $appExe.VersionInfo.ProductVersion
            $fileVersion = $appExe.VersionInfo.FileVersion
            if (($productVersion -notlike "$ExpectedVersion*") -and ($fileVersion -notlike "$ExpectedVersion*")) {
              throw "Installed executable version mismatch. Expected $ExpectedVersion; product=$productVersion file=$fileVersion path=$($appExe.FullName)"
            }
            Write-Host "Verified installed OpenMindAI $ExpectedVersion at $($appExe.FullName)"
          }

          function Assert-NativeRuntime {
            param([string]$Destination)
            $appExe = Resolve-InstalledApp -Destination $Destination
            $appDir = $appExe.Directory.FullName
            foreach ($dll in @('llama.dll', 'ggml.dll', 'ggml-base.dll', 'ggml-cpu.dll')) {
              $path = Join-Path $appDir $dll
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Installed native runtime DLL missing beside app: $path"
              }
            }
            $manifestPath = Join-Path $appDir 'resources/native-runtime/windows-x86_64/native-runtime-manifest.json'
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              throw "Installed native runtime manifest missing: $manifestPath"
            }
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.llamaCppCommit -ne $env:LLAMA_CPP_COMMIT) {
              throw "Native runtime ABI mismatch in installer: $($manifest.llamaCppCommit)"
            }
            Write-Host "Verified native runtime $($manifest.abiTag) beside $($appExe.Name)"
          }

          function Remove-SmokeInstall {
            param([string]$Destination)
            if (-not (Test-Path -LiteralPath $Destination)) {
              return
            }
            $uninstaller = Get-ChildItem -LiteralPath $Destination -Filter '*.exe' -File -Recurse |
              Where-Object { $_.Name -match '(?i)uninstall' } |
              Select-Object -First 1
            if ($null -ne $uninstaller) {
              $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                throw "Uninstaller failed with exit code $($process.ExitCode): $($uninstaller.FullName)"
              }
            }
            if (Test-Path -LiteralPath $Destination) {
              Remove-Item -LiteralPath $Destination -Recurse -Force
            }
          }

          $v2Installer = Join-Path $env:RUNNER_TEMP 'OpenMindAI_2.0.0_x64-setup.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/smshagor-dev/OpenMindAI/releases/download/v2.0.0/OpenMindAI_2.0.0_x64-setup.exe' -OutFile $v2Installer
          if ((Get-Item -LiteralPath $v2Installer).Length -le 0) {
            throw 'Downloaded v2.0.0 installer is empty.'
          }

          $upgradeRoot = Join-Path $env:RUNNER_TEMP 'OpenMindAI-v3-upgrade-smoke'
          Invoke-SilentInstaller -InstallerPath $v2Installer -Destination $upgradeRoot
          if (-not (Test-Path -LiteralPath $upgradeRoot)) {
            throw 'v2.0.0 smoke installation did not create the expected destination.'
          }
          $upgradeProcess = Start-Process -FilePath $candidate.FullName -ArgumentList @('/S', "/D=$upgradeRoot") -Wait -PassThru
          if ($upgradeProcess.ExitCode -ne 0) {
            throw "v2.0.0 to $version upgrade failed with exit code $($upgradeProcess.ExitCode)."
          }
          Assert-InstalledVersion -Destination $upgradeRoot -ExpectedVersion $version
          Assert-NativeRuntime -Destination $upgradeRoot
          Remove-SmokeInstall -Destination $upgradeRoot

          $cleanRoot = Join-Path $env:RUNNER_TEMP 'OpenMindAI-v3-clean-smoke'
          Invoke-SilentInstaller -InstallerPath $candidate.FullName -Destination $cleanRoot
          Assert-InstalledVersion -Destination $cleanRoot -ExpectedVersion $version
          Assert-NativeRuntime -Destination $cleanRoot
          Remove-SmokeInstall -Destination $cleanRoot

          Write-Host "Windows NSIS native clean-install and v2.0.0 -> $version upgrade smoke tests passed."

      - name: Remove smoke build configuration
        if: always()
        shell: pwsh
        run: |
          Remove-Item "src-tauri/tauri.release-smoke.conf.json" -Force -ErrorAction SilentlyContinue
          Remove-Item "src-tauri/native-runtime" -Recurse -Force -ErrorAction SilentlyContinue
