name: Local Agent Cleanup

on:
  push:
    branches:
      - project-local-agent-e2e

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: project-local-agent-e2e
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clean imports and format Rust
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/local_agent.rs')
          text = path.read_text()
          text = text.replace('    time::{Duration, Instant},\n', '    time::Duration,\n')
          text = text.replace('\nuse chrono::Utc;\n', '\n')
          path.write_text(text)
          PY
          cd src-tauri
          cargo fmt --all
      - name: Commit cleanup
        run: |
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/src/local_agent.rs src-tauri/src/lib.rs src-tauri/src/lib_legacy.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No cleanup changes needed."
          else
            git commit -m "fix(agent): format local agent engine"
            git push
          fi
