name: MCP Clippy Fix

on:
  push:
    branches:
      - fix-mcp-type-inference-main
    paths:
      - .github/workflows/mcp-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-mcp-type-inference-main
      - name: Apply Clippy fix and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/connector_ecosystem.rs')
          text = path.read_text()
          old = '.filter(|line| !line.is_empty())\n            .last()\n            .ok_or_else(|| connector_error("mcp", "SSE response did not contain JSON data"))?;'
          new = '.filter(|line| !line.is_empty())\n            .next_back()\n            .ok_or_else(|| connector_error("mcp", "SSE response did not contain JSON data"))?;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one MCP SSE last() pattern, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/mcp-clippy-fix.yml
          git config user.name openmindai-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix(connectors): satisfy Clippy for MCP SSE parser"
          git push origin HEAD:fix-mcp-type-inference-main
