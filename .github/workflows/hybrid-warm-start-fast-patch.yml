name: Hybrid Warm Start Fast Patch

on:
  push:
    branches:
      - perf/hybrid-warm-start

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/hybrid-warm-start
          fetch-depth: 1

      - name: Apply production warm-start integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('src-tauri/src/lib.rs', 'mod vision_batch;\n\npub(crate) use connected_agent::{', 'mod vision_batch;\nmod warm_start;\n\npub(crate) use connected_agent::{', 'register warm_start module')

          replace_once('src-tauri/src/inference.rs', '''    pub fn finish(&self, conversation_id: &str) {\n        if let Ok(mut tokens) = self.tokens.lock() {\n            tokens.remove(conversation_id);\n        }\n    }\n}\n''', '''    pub fn finish(&self, conversation_id: &str) {\n        if let Ok(mut tokens) = self.tokens.lock() {\n            tokens.remove(conversation_id);\n        }\n    }\n\n    pub fn is_idle(&self) -> bool {\n        self.tokens.lock().map_or(true, |tokens| tokens.is_empty())\n    }\n}\n''', 'active generation idle state')

          replace_once('src-tauri/src/inference.rs', '''        "max_tokens": config.max_tokens,\n        "presence_penalty": config.presence_penalty,\n        "chat_template_kwargs": {\n''', '''        "max_tokens": config.max_tokens,\n        "presence_penalty": config.presence_penalty,\n        // Keep llama-server's KV prompt cache enabled so the shared prefix of\n        // an ongoing conversation can be reused instead of fully prefilling\n        // it on every turn.\n        "cache_prompt": true,\n        "chat_template_kwargs": {\n''', 'prompt cache request hint')

          legacy = 'src-tauri/src/lib_legacy.rs'
          replace_once(legacy, '''    active_generations: ActiveGenerations,\n    http: Client,\n}\n''', '''    active_generations: ActiveGenerations,\n    warm_start: warm_start::WarmStartCoordinator,\n    http: Client,\n}\n''', 'app warm coordinator state')

          replace_once(legacy, '''        let mut runtime = state\n            .runtime\n            .lock()\n            .map_err(|_| app_error::AppError::internal("runtime lock poisoned"))?;\n        runtime.ensure_model_server(&hardware, &plan.config)?\n    };\n\n    let db = state\n''', '''        let mut runtime = state\n            .runtime\n            .lock()\n            .map_err(|_| app_error::AppError::internal("runtime lock poisoned"))?;\n        let status = runtime.ensure_model_server(&hardware, &plan.config)?;\n        state.warm_start.mark_runtime_ready(&model.id);\n        status\n    };\n\n    let db = state\n''', 'activate model warm state')

          replace_once(legacy, '''        let status = runtime.ensure_model_server(&hardware, &plan.config)?;\n        status.endpoint.ok_or_else(|| {\n            app_error::AppError::InferenceServerUnavailable("runtime endpoint missing".to_string())\n        })?\n''', '''        let status = runtime.ensure_model_server(&hardware, &plan.config)?;\n        state.warm_start.mark_runtime_ready(&model.id);\n        status.endpoint.ok_or_else(|| {\n            app_error::AppError::InferenceServerUnavailable("runtime endpoint missing".to_string())\n        })?\n''', 'generation warm state')

          # Mark foreground intent immediately so startup preload can yield if it
          # has not begun yet. The async wait itself happens after inference:started
          # is emitted, so the user's message appears instantly while the exact
          # same model finishes warming in the background.
          replace_once(legacy, '''    let routing = resolve_conversation_model(&state, &conversation_id, &mode, trimmed)?;\n    let model = routing.model;\n    sync_project_context(&state, &conversation_id)?;\n''', '''    let routing = resolve_conversation_model(&state, &conversation_id, &mode, trimmed)?;\n    let model = routing.model;\n    state.warm_start.note_foreground_request(&model.id);\n    sync_project_context(&state, &conversation_id)?;\n''', 'send foreground intent')

          replace_once(legacy, '''    )\n    .map_err(|error| app_error::AppError::StreamFailed(error.to_string()))?;\n\n    run_streaming_completion(\n        &app,\n        &state,\n        &conversation_id,\n        &model,\n        &assistant,\n        &mode,\n        &media,\n    )\n''', '''    )\n    .map_err(|error| app_error::AppError::StreamFailed(error.to_string()))?;\n\n    state.warm_start.wait_if_loading(&model.id).await;\n    run_streaming_completion(\n        &app,\n        &state,\n        &conversation_id,\n        &model,\n        &assistant,\n        &mode,\n        &media,\n    )\n''', 'send queue after visible start')

          replace_once(legacy, '''    let routing = resolve_conversation_model(&state, &conversation_id, &mode, &user.content)?;\n    let model = routing.model;\n    sync_project_context(&state, &conversation_id)?;\n''', '''    let routing = resolve_conversation_model(&state, &conversation_id, &mode, &user.content)?;\n    let model = routing.model;\n    state.warm_start.note_foreground_request(&model.id);\n    sync_project_context(&state, &conversation_id)?;\n''', 'regenerate foreground intent')

          # The regenerate call has the same completion invocation shape but ends
          # with Ok(assistant), so patch that distinct occurrence.
          marker = '''    run_streaming_completion(\n        &app,\n        &state,\n        &conversation_id,\n        &model,\n        &assistant,\n        &mode,\n        &[],\n    )\n    .await?;\n    Ok(assistant)\n'''
          replacement = '''    state.warm_start.wait_if_loading(&model.id).await;\n    run_streaming_completion(\n        &app,\n        &state,\n        &conversation_id,\n        &model,\n        &assistant,\n        &mode,\n        &[],\n    )\n    .await?;\n    Ok(assistant)\n'''
          replace_once(legacy, marker, replacement, 'regenerate queue after visible start')

          replace_once(legacy, '''fn stop_llama_runtime(state: State<AppState>) -> Result<(), app_error::AppError> {\n    let mut runtime = state\n        .runtime\n        .lock()\n        .map_err(|_| app_error::AppError::internal("runtime lock poisoned"))?;\n    runtime.stop()\n}\n''', '''fn stop_llama_runtime(state: State<AppState>) -> Result<(), app_error::AppError> {\n    let mut runtime = state\n        .runtime\n        .lock()\n        .map_err(|_| app_error::AppError::internal("runtime lock poisoned"))?;\n    runtime.stop()?;\n    state.warm_start.mark_runtime_stopped();\n    Ok(())\n}\n''', 'manual runtime stop warm state')

          replace_once(legacy, '''            runtime_installer,\n            active_generations: ActiveGenerations::default(),\n            http: Client::new(),\n        })\n        .invoke_handler(tauri::generate_handler![\n''', '''            runtime_installer,\n            active_generations: ActiveGenerations::default(),\n            warm_start: warm_start::WarmStartCoordinator::default(),\n            http: Client::new(),\n        })\n        .setup(|app| {\n            // Window creation stays non-blocking. Only OpenMindAI Core is\n            // preloaded; heavier reasoning, vision and media models stay on-demand.\n            warm_start::spawn_background_services(app.handle().clone());\n            Ok(())\n        })\n        .invoke_handler(tauri::generate_handler![\n''', 'spawn startup warm services')

          warm = Path('src-tauri/src/warm_start.rs')
          text = warm.read_text(encoding='utf-8')
          old = '''    pub fn mark_runtime_ready(&self, model_id: &str) {\n        if let Ok(mut state) = self.state.lock() {\n            state.phase = WarmPhase::Ready;\n            state.model_id = Some(model_id.to_string());\n        }\n        self.notify.notify_waiters();\n    }\n'''
          new = old + '''\n    pub fn mark_runtime_stopped(&self) {\n        if let Ok(mut state) = self.state.lock() {\n            state.phase = WarmPhase::Idle;\n            state.model_id = None;\n        }\n        self.notify.notify_waiters();\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('warm coordinator stop reset: expected exactly one match')
          text = text.replace(old, new, 1)
          # A preload with no foreground chat should still be eligible for a later
          # low-memory trim after the idle window.
          old_finish = '''                state.phase = if success {\n                    WarmPhase::Ready\n                } else {\n                    WarmPhase::Failed\n                };\n'''
          new_finish = '''                state.phase = if success {\n                    state.last_foreground_use.get_or_insert_with(Instant::now);\n                    WarmPhase::Ready\n                } else {\n                    WarmPhase::Failed\n                };\n'''
          if text.count(old_finish) != 1:
              raise SystemExit('background idle timestamp: expected exactly one match')
          warm.write_text(text.replace(old_finish, new_finish, 1), encoding='utf-8')
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Commit production patch and remove helpers
        shell: bash
        run: |
          rm -f .github/workflows/hybrid-warm-start-patch.yml
          rm -f .github/workflows/hybrid-warm-start-fast-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src-tauri/src/lib_legacy.rs src-tauri/src/inference.rs src-tauri/src/warm_start.rs .github/workflows/
          git commit -m "perf(chat): preload core model in background"
          git push origin HEAD:perf/hybrid-warm-start
