name: Sync runtime installer from main

on:
  push:
    branches:
      - end-to-end-video-voice-runtime
    paths:
      - .github/workflows/sync-runtime-install.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout media branch
        uses: actions/checkout@v4
        with:
          ref: end-to-end-video-voice-runtime
          fetch-depth: 0

      - name: Keep latest main runtime installer
        run: |
          git fetch origin main
          git checkout origin/main -- src-tauri/src/runtime_install.rs
          rm .github/workflows/sync-runtime-install.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sync runtime installer with latest main"
          git push origin HEAD:end-to-end-video-voice-runtime
