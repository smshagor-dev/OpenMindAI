name: Force sync runtime installer from main

on:
  push:
    branches:
      - end-to-end-video-voice-runtime
    paths:
      - .github/workflows/sync-runtime-install.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout media branch
        uses: actions/checkout@v4
        with:
          ref: end-to-end-video-voice-runtime
          fetch-depth: 0

      - name: Force latest main runtime installer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          local_main=$(git rev-parse refs/remotes/origin/main)
          test "$remote_main" = "$local_main"
          echo "syncing runtime installer from main $local_main"
          git checkout refs/remotes/origin/main -- src-tauri/src/runtime_install.rs
          rm .github/workflows/sync-runtime-install.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Force sync runtime installer with latest main"
          git push origin HEAD:end-to-end-video-voice-runtime
