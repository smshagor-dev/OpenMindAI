name: V3 Project Work Finalizer

on:
  push:
    branches:
      - "feature/v3-project-work-100"
    paths:
      - ".github/workflows/v3-project-work-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/v3-project-work-100
          fetch-depth: 0

      - name: Apply final Project Agent and Work tab patch
        run: python3 scripts/v3-project-work-finalize.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Validate frontend and patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check

      - name: Commit final v3 project experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v3-project-work-finalize.yml scripts/v3-project-work-finalize.py
          git add -A
          git commit -m "feat(projects): complete v3 agent work experience"
          git push origin HEAD:feature/v3-project-work-100
