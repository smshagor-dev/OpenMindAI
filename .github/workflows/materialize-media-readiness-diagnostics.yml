name: Materialize media readiness diagnostics

on:
  push:
    branches:
      - media-readiness-diagnostics
    paths:
      - scripts/apply_media_readiness_diagnostics.py
      - .github/workflows/materialize-media-readiness-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: media-readiness-diagnostics-materializer
  cancel-in-progress: true

jobs:
  materialize-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: media-readiness-diagnostics

      - name: Apply diagnostics integration
        run: python scripts/apply_media_readiness_diagnostics.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/materialize-media-readiness-diagnostics.yml

      - name: Diff hygiene
        run: git diff --check

      - name: Commit validated production diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expose media readiness in maintenance diagnostics"
          git push origin HEAD:media-readiness-diagnostics
