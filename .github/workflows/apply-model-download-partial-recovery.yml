name: Apply model download partial recovery

on:
  push:
    branches:
      - model-download-partial-recovery
    paths:
      - scripts/apply_model_download_partial_recovery.py
      - .github/workflows/apply-model-download-partial-recovery.yml

permissions:
  contents: write

concurrency:
  group: model-download-partial-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: model-download-partial-recovery
          fetch-depth: 0

      - name: Apply production recovery patch
        run: python scripts/apply_model_download_partial_recovery.py

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format production Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-model-download-partial-recovery.yml

      - name: Diff hygiene
        run: |
          git diff --check
          test ! -e scripts/apply_model_download_partial_recovery.py
          test ! -e .github/workflows/apply-model-download-partial-recovery.yml

      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden partial model download recovery"
          git push origin HEAD:model-download-partial-recovery
