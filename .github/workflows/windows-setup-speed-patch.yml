name: Windows Setup Speed Patch

on:
  push:
    branches:
      - perf/windows-setup-speed

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/windows-setup-speed
          fetch-depth: 1

      - name: Apply setup performance fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path: Path, pattern: str, replacement: str, label: str, flags=0) -> None:
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(updated, encoding='utf-8')

          bootstrap = Path('bootstrap/windows/bootstrap.ps1')

          release_replacement = r'''  $checksumAsset = $release.assets | Where-Object { $_.name -eq "SHA256SUMS.txt" } | Select-Object -First 1
          return [PSCustomObject]@{
            Version     = $release.tag_name
            Name        = $asset.name
            Url         = $asset.browser_download_url
            Digest      = $asset.digest
            ChecksumUrl = if ($checksumAsset) { $checksumAsset.browser_download_url } else { $null }
          }
          }

          function Install-PrebuiltRelease($asset, [string]$installDir) {
            Write-Step "Downloading OpenMindAI $($asset.Version) ($($asset.Name))..."
            New-Item -ItemType Directory -Force -Path $installDir | Out-Null
            $installerPath = Join-Path $installDir $asset.Name
            $downloadTimer = [System.Diagnostics.Stopwatch]::StartNew()
            Invoke-WebRequest -UseBasicParsing -Uri $asset.Url -OutFile $installerPath
            $downloadTimer.Stop()
            Write-Info ("Installer download completed in {0:N1}s." -f $downloadTimer.Elapsed.TotalSeconds)

            $expected = $null
            if ($asset.Digest -and $asset.Digest -match '^sha256:([0-9a-fA-F]{64})$') {
              $expected = $matches[1]
            } elseif ($asset.ChecksumUrl) {
              $sums = Invoke-WebRequest -UseBasicParsing -Uri $asset.ChecksumUrl | Select-Object -ExpandProperty Content
              $line = $sums -split "`n" | Where-Object { $_ -match [regex]::Escape($asset.Name) } | Select-Object -First 1
              if ($line) { $expected = ($line -split '\s+' | Select-Object -First 1) }
            }

            if (-not $expected) {
              Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
              throw "No SHA-256 digest is published for this installer -- refusing to run an unverified download."
            }

            Write-Info "Verifying installer SHA-256..."
            $verifyTimer = [System.Diagnostics.Stopwatch]::StartNew()
            $actual = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash
            $verifyTimer.Stop()
            if ($actual -ine $expected) {
              Remove-Item $installerPath -Force
              throw "Checksum mismatch for downloaded installer -- refusing to run it."
            }
            Write-Info ("Checksum verified in {0:N1}s." -f $verifyTimer.Elapsed.TotalSeconds)

            Write-Step "Running installer..."
            Start-Process -FilePath $installerPath -Wait
            return $installerPath
          }

          '''
          sub_once(
              bootstrap,
              r'  return \[PSCustomObject\]@\{\n    Version = \$release\.tag_name\n    Name    = \$asset\.name\n    Url     = \$asset\.browser_download_url\n  \}\n\}\n\nfunction Install-PrebuiltRelease\(\$asset, \[string\]\$installDir\) \{.*?\n\}\n\n(?=# ---------------------------------------------------------------------\n# Source build fallback)',
              release_replacement,
              'prebuilt release block',
              re.S,
          )

          npm_replacement = r'''      if (Test-Path (Join-Path $sourceRoot "package-lock.json")) {
                & npm ci --no-audit --no-fund | Out-Host
                if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
              } else {
                & npm install --no-audit --no-fund | Out-Host
                if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
              }'''
          sub_once(
              bootstrap,
              r'      & npm install \| Out-Host\n      if \(\$LASTEXITCODE -ne 0\) \{ throw "npm install failed" \}',
              npm_replacement,
              'npm install block',
          )

          main_replacement = r'''  $sourceRoot = Resolve-SourceRoot
            $sourceValid = Test-ValidOpenMindAISource $sourceRoot
            $existingExe = $null
            if ($sourceValid -and (Get-Command cargo -ErrorAction SilentlyContinue)) {
              $existingExe = Find-ExistingBuild $sourceRoot
            }
            $exePath = $null

            # Normal users take the small prebuilt release path first. Do not
            # install Git, clone source, or invoke Cargo unless source fallback
            # is actually required.
            if (-not $DeveloperMode) {
              if ($existingExe) {
                Write-Info "Using existing OpenMindAI build."
                $exePath = $existingExe
              } elseif ($online) {
                $release = Resolve-PrebuiltRelease
                if ($release) {
                  $installDir = Join-Path $LauncherRoot "release-download"
                  Install-PrebuiltRelease $release $installDir | Out-Null
                  Write-Step "OpenMindAI installed. Launch it from the Start Menu."
                  if (-not $NoLaunch) { exit 0 }
                  Write-Host ""
                  Write-Host "OpenMindAI is ready." -ForegroundColor Green
                  exit 0
                }
              }
            }

            # Developer mode, or the rare case where no compatible prebuilt
            # release exists, falls back to source. Only now pay Git/clone and
            # frontend/Rust build costs.
            if (-not $sourceValid) {
              if (-not $online) {
                throw "OpenMindAI isn't installed yet and no internet connection is available to set it up. Connect to the internet and run setup again."
              }
              if (-not (Test-GitAvailable)) { Install-Git }
              Sync-Source $sourceRoot
              $sourceValid = $true
            } else {
              Write-Info "Existing OpenMindAI source found at $sourceRoot"
              if ((Test-Path (Join-Path $sourceRoot ".git")) -and (Test-GitAvailable) -and $online) {
                Sync-Source $sourceRoot
              }
            }

            if (-not $existingExe -and (Get-Command cargo -ErrorAction SilentlyContinue)) {
              $existingExe = Find-ExistingBuild $sourceRoot
            }

            if ($existingExe -and -not $DeveloperMode) {
              $exePath = $existingExe
            } elseif ($DeveloperMode -or $online) {
              $exePath = Build-FromSource $sourceRoot
            } elseif ($existingExe) {
              $exePath = $existingExe
            } else {
              throw "No installed OpenMindAI build found, and no internet connection is available to install one."
            }

          '''
          sub_once(
              bootstrap,
              r'  \$sourceRoot = Resolve-SourceRoot\n.*?\n  if \(\$exePath -and -not \$NoLaunch\) \{',
              main_replacement + '  if ($exePath -and -not $NoLaunch) {',
              'bootstrap main flow',
              re.S,
          )

          setup = Path('src/components/SetupWizard.tsx')
          sub_once(
              setup,
              r'  useEffect\(\(\) => \{\n    if \(modelReady && runtimeReady\) return;\n    const interval = window\.setInterval\(\(\) => void props\.refresh\?\.\(\), 3000\);\n    return \(\) => window\.clearInterval\(interval\);\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  \}, \[modelReady, runtimeReady\]\);\n\n',
              '  // Runtime installation and model downloads already trigger one explicit\n  // refresh when they complete. Avoid refreshing the entire application every\n  // three seconds while setup is running: that refresh recursively scans model\n  // and storage directories and creates unnecessary disk I/O on Windows.\n\n',
              'setup full-refresh poll',
          )

          runtime = Path('src-tauri/src/runtime_install.rs')
          sub_once(
              runtime,
              r'        let os = target_os\(\);\n        let arch = target_arch\(\);\n        let mut last_error: Option<AppError> = None;',
              '''        let os = target_os();\n        let arch = target_arch();\n        let releases = match fetch_recent_releases(&self.client).await {\n            Ok(releases) => releases,\n            Err(error) => {\n                let message = error.to_string();\n                self.set_state(RuntimeInstallState::Failed, Some(message))?;\n                return Err(error);\n            }\n        };\n        let mut last_error: Option<AppError> = None;''',
              'runtime release fetch',
          )
          sub_once(
              runtime,
              r'            match self\.install_backend\(&backend, pattern, &token\)\.await \{',
              '''            match self\n                .install_backend(&backend, pattern, &releases, &token)\n                .await\n            {''',
              'runtime backend call',
          )
          sub_once(
              runtime,
              r'    async fn install_backend\(\n        &self,\n        backend: &BackendKind,\n        pattern: &str,\n        token: &CancellationToken,\n    \) -> Result<RuntimeInstallStatus, AppError> \{',
              '''    async fn install_backend(\n        &self,\n        backend: &BackendKind,\n        pattern: &str,\n        releases: &[GithubRelease],\n        token: &CancellationToken,\n    ) -> Result<RuntimeInstallStatus, AppError> {''',
              'runtime backend signature',
          )
          sub_once(
              runtime,
              r'        let releases = fetch_recent_releases\(&self\.client\)\.await\?;\n        let \(release, asset\) = resolve_release_asset\(&releases, pattern\)\.ok_or_else\(\|\| \{',
              '        let (release, asset) = resolve_release_asset(releases, pattern).ok_or_else(|| {',
              'runtime duplicate release fetch',
          )
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Commit production patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/windows-setup-speed-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/windows/bootstrap.ps1 src/components/SetupWizard.tsx src-tauri/src/runtime_install.rs .github/workflows/windows-setup-speed-patch.yml
          git commit -m "perf(setup): speed up Windows first-run installation"
          git push origin HEAD:perf/windows-setup-speed
