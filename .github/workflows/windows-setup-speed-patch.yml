name: Windows Setup Speed Patch

on:
  push:
    branches:
      - perf/windows-setup-speed

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/windows-setup-speed
          fetch-depth: 1

      - name: Apply setup performance fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          bootstrap = Path('bootstrap/windows/bootstrap.ps1')
          old_release = r'''  return [PSCustomObject]@{
            Version = $release.tag_name
            Name    = $asset.name
            Url     = $asset.browser_download_url
          }
          }

          function Install-PrebuiltRelease($asset, [string]$installDir) {
            Write-Step "Downloading OpenMindAI $($asset.Version) ($($asset.Name))..."
            New-Item -ItemType Directory -Force -Path $installDir | Out-Null
            $installerPath = Join-Path $installDir $asset.Name
            Invoke-WebRequest -UseBasicParsing -Uri $asset.Url -OutFile $installerPath

            $checksumAsset = $null
            try {
              $checksumAsset = (Invoke-RestMethod -UseBasicParsing -Uri "https://api.github.com/repos/$RepoOwner/$RepoName/releases/latest").assets |
                Where-Object { $_.name -eq "SHA256SUMS.txt" } | Select-Object -First 1
            } catch {}
            if ($checksumAsset) {
              Write-Info "Verifying checksum..."
              $sums = Invoke-WebRequest -UseBasicParsing -Uri $checksumAsset.browser_download_url | Select-Object -ExpandProperty Content
              $expected = ($sums -split "`n" | Where-Object { $_ -match [regex]::Escape($asset.Name) } | Select-Object -First 1) -split '\s+' | Select-Object -First 1
              $actual = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash
              if ($expected -and ($actual -notlike "$expected*")) {
                Remove-Item $installerPath -Force
                throw "Checksum mismatch for downloaded installer -- refusing to run it."
              }
              Write-Info "Checksum verified."
            } else {
              Write-Warn "No published checksum found for this release -- installing unverified."
            }

            Write-Step "Running installer..."
            Start-Process -FilePath $installerPath -Wait
            return $installerPath
          }
          '''
          new_release = r'''  $checksumAsset = $release.assets | Where-Object { $_.name -eq "SHA256SUMS.txt" } | Select-Object -First 1
          return [PSCustomObject]@{
            Version     = $release.tag_name
            Name        = $asset.name
            Url         = $asset.browser_download_url
            Digest      = $asset.digest
            ChecksumUrl = if ($checksumAsset) { $checksumAsset.browser_download_url } else { $null }
          }
          }

          function Install-PrebuiltRelease($asset, [string]$installDir) {
            Write-Step "Downloading OpenMindAI $($asset.Version) ($($asset.Name))..."
            New-Item -ItemType Directory -Force -Path $installDir | Out-Null
            $installerPath = Join-Path $installDir $asset.Name
            $downloadTimer = [System.Diagnostics.Stopwatch]::StartNew()
            Invoke-WebRequest -UseBasicParsing -Uri $asset.Url -OutFile $installerPath
            $downloadTimer.Stop()
            Write-Info ("Installer download completed in {0:N1}s." -f $downloadTimer.Elapsed.TotalSeconds)

            $expected = $null
            if ($asset.Digest -and $asset.Digest -match '^sha256:([0-9a-fA-F]{64})$') {
              $expected = $matches[1]
            } elseif ($asset.ChecksumUrl) {
              $sums = Invoke-WebRequest -UseBasicParsing -Uri $asset.ChecksumUrl | Select-Object -ExpandProperty Content
              $line = $sums -split "`n" | Where-Object { $_ -match [regex]::Escape($asset.Name) } | Select-Object -First 1
              if ($line) { $expected = ($line -split '\s+' | Select-Object -First 1) }
            }

            if (-not $expected) {
              Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
              throw "No SHA-256 digest is published for this installer -- refusing to run an unverified download."
            }

            Write-Info "Verifying installer SHA-256..."
            $verifyTimer = [System.Diagnostics.Stopwatch]::StartNew()
            $actual = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash
            $verifyTimer.Stop()
            if ($actual -ine $expected) {
              Remove-Item $installerPath -Force
              throw "Checksum mismatch for downloaded installer -- refusing to run it."
            }
            Write-Info ("Checksum verified in {0:N1}s." -f $verifyTimer.Elapsed.TotalSeconds)

            Write-Step "Running installer..."
            Start-Process -FilePath $installerPath -Wait
            return $installerPath
          }
          '''
          replace_once(bootstrap, old_release, new_release, 'prebuilt release block')

          old_npm = r'''      & npm install | Out-Host
                if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          '''
          new_npm = r'''      if (Test-Path (Join-Path $sourceRoot "package-lock.json")) {
                  & npm ci --no-audit --no-fund | Out-Host
                  if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
                } else {
                  & npm install --no-audit --no-fund | Out-Host
                  if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
                }
          '''
          replace_once(bootstrap, old_npm, new_npm, 'npm install block')

          old_main = r'''  $sourceRoot = Resolve-SourceRoot

            if (-not (Test-ValidOpenMindAISource $sourceRoot)) {
              if (-not $online) {
                throw "OpenMindAI isn't installed yet and no internet connection is available to set it up. Connect to the internet and run setup again."
              }
              if (-not (Test-GitAvailable)) { Install-Git }
              Sync-Source $sourceRoot
            } else {
              Write-Info "Existing OpenMindAI source found at $sourceRoot"
              if ((Test-Path (Join-Path $sourceRoot ".git")) -and (Test-GitAvailable) -and $online) {
                Sync-Source $sourceRoot
              }
            }

            # Already built? Reuse it -- this is the fast "second run" / offline path.
            $existingExe = Find-ExistingBuild $sourceRoot
            $exePath = $null

            if ($existingExe -and -not $DeveloperMode) {
              Write-Info "Using existing OpenMindAI build."
              $exePath = $existingExe
            } elseif ($online) {
              $release = Resolve-PrebuiltRelease
              if ($release) {
                $installDir = Join-Path $LauncherRoot "release-download"
                Install-PrebuiltRelease $release $installDir | Out-Null
                Write-Step "OpenMindAI installed. Launch it from the Start Menu."
                if (-not $NoLaunch) { exit 0 }
              } else {
                $exePath = Build-FromSource $sourceRoot
              }
            } elseif ($existingExe) {
              $exePath = $existingExe
            } else {
              throw "No installed OpenMindAI build found, and no internet connection is available to install one."
            }
          '''
          new_main = r'''  $sourceRoot = Resolve-SourceRoot
            $sourceValid = Test-ValidOpenMindAISource $sourceRoot
            $existingExe = $null
            if ($sourceValid -and (Get-Command cargo -ErrorAction SilentlyContinue)) {
              $existingExe = Find-ExistingBuild $sourceRoot
            }
            $exePath = $null

            # Normal users take the small signed/prebuilt release path first.
            # Do not install Git, clone the repository, run cargo metadata, or
            # touch a source checkout unless a source build is actually needed.
            if (-not $DeveloperMode) {
              if ($existingExe) {
                Write-Info "Using existing OpenMindAI build."
                $exePath = $existingExe
              } elseif ($online) {
                $release = Resolve-PrebuiltRelease
                if ($release) {
                  $installDir = Join-Path $LauncherRoot "release-download"
                  Install-PrebuiltRelease $release $installDir | Out-Null
                  Write-Step "OpenMindAI installed. Launch it from the Start Menu."
                  if (-not $NoLaunch) { exit 0 }
                  Write-Host ""
                  Write-Host "OpenMindAI is ready." -ForegroundColor Green
                  exit 0
                }
              }
            }

            # Developer mode, or the rare case where no compatible prebuilt
            # release exists, falls back to source. Only now pay the Git/clone
            # and dependency/build cost.
            if (-not $sourceValid) {
              if (-not $online) {
                throw "OpenMindAI isn't installed yet and no internet connection is available to set it up. Connect to the internet and run setup again."
              }
              if (-not (Test-GitAvailable)) { Install-Git }
              Sync-Source $sourceRoot
              $sourceValid = $true
            } else {
              Write-Info "Existing OpenMindAI source found at $sourceRoot"
              if ((Test-Path (Join-Path $sourceRoot ".git")) -and (Test-GitAvailable) -and $online) {
                Sync-Source $sourceRoot
              }
            }

            if (-not $existingExe -and (Get-Command cargo -ErrorAction SilentlyContinue)) {
              $existingExe = Find-ExistingBuild $sourceRoot
            }

            if ($existingExe -and -not $DeveloperMode) {
              $exePath = $existingExe
            } elseif ($DeveloperMode -or $online) {
              $exePath = Build-FromSource $sourceRoot
            } elseif ($existingExe) {
              $exePath = $existingExe
            } else {
              throw "No installed OpenMindAI build found, and no internet connection is available to install one."
            }
          '''
          replace_once(bootstrap, old_main, new_main, 'bootstrap main flow')

          setup = Path('src/components/SetupWizard.tsx')
          old_poll = '''  useEffect(() => {\n    if (modelReady && runtimeReady) return;\n    const interval = window.setInterval(() => void props.refresh?.(), 3000);\n    return () => window.clearInterval(interval);\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [modelReady, runtimeReady]);\n\n'''
          new_poll = '''  // Runtime installation and model downloads already trigger one explicit\n  // refresh when they complete. Avoid refreshing the entire application every\n  // three seconds while setup is running: that refresh recursively scans model\n  // and storage directories and creates unnecessary disk I/O on Windows.\n\n'''
          replace_once(setup, old_poll, new_poll, 'setup full-refresh poll')

          runtime = Path('src-tauri/src/runtime_install.rs')
          old_loop = '''        let os = target_os();\n        let arch = target_arch();\n        let mut last_error: Option<AppError> = None;\n        for backend in preferred_backend_order(hardware) {\n'''
          new_loop = '''        let os = target_os();\n        let arch = target_arch();\n        let releases = match fetch_recent_releases(&self.client).await {\n            Ok(releases) => releases,\n            Err(error) => {\n                let message = error.to_string();\n                self.set_state(RuntimeInstallState::Failed, Some(message))?;\n                return Err(error);\n            }\n        };\n        let mut last_error: Option<AppError> = None;\n        for backend in preferred_backend_order(hardware) {\n'''
          replace_once(runtime, old_loop, new_loop, 'runtime release fetch')

          old_call = '''            match self.install_backend(&backend, pattern, &token).await {\n'''
          new_call = '''            match self\n                .install_backend(&backend, pattern, &releases, &token)\n                .await\n            {\n'''
          replace_once(runtime, old_call, new_call, 'runtime backend call')

          old_sig = '''    async fn install_backend(\n        &self,\n        backend: &BackendKind,\n        pattern: &str,\n        token: &CancellationToken,\n    ) -> Result<RuntimeInstallStatus, AppError> {\n'''
          new_sig = '''    async fn install_backend(\n        &self,\n        backend: &BackendKind,\n        pattern: &str,\n        releases: &[GithubRelease],\n        token: &CancellationToken,\n    ) -> Result<RuntimeInstallStatus, AppError> {\n'''
          replace_once(runtime, old_sig, new_sig, 'runtime backend signature')

          old_fetch = '''        let releases = fetch_recent_releases(&self.client).await?;\n        let (release, asset) = resolve_release_asset(&releases, pattern).ok_or_else(|| {\n'''
          new_fetch = '''        let (release, asset) = resolve_release_asset(releases, pattern).ok_or_else(|| {\n'''
          replace_once(runtime, old_fetch, new_fetch, 'runtime duplicate release fetch')
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Commit production patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/windows-setup-speed-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/windows/bootstrap.ps1 src/components/SetupWizard.tsx src-tauri/src/runtime_install.rs .github/workflows/windows-setup-speed-patch.yml
          git commit -m "perf(setup): speed up Windows first-run installation"
          git push origin HEAD:perf/windows-setup-speed
