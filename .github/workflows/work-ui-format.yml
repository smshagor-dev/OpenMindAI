name: Work UI Format Finalizer

on:
  push:
    branches:
      - fix/chatgpt-style-work-apps

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/chatgpt-style-work-apps
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format modified UI
        run: |
          npx prettier --write \
            src/App.tsx \
            src/components/AppsSettings.tsx \
            src/components/ChatModeSwitcher.tsx \
            src/components/ProjectsWorkspace.tsx \
            src/components/SettingsDialog.tsx \
            src/projects.css \
            src/styles.css \
            docs/CONNECTED_APPS.md
      - name: Validate
        run: |
          npm run lint
          npm run build
      - name: Commit formatting
        shell: bash
        run: |
          rm -f .github/workflows/work-ui-format.yml
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(work): format project Work and Apps UI"
          git push origin HEAD:fix/chatgpt-style-work-apps
