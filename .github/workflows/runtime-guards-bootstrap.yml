name: Runtime Guards Integration

on:
  push:
    branches:
      - work/runtime-guards-v2

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/runtime-guards-v2
          fetch-depth: 0

      - name: Apply runtime guard integration
        run: python scripts/bootstrap_runtime_guards.py

      - name: Remove one-shot integration files
        run: |
          rm scripts/bootstrap_runtime_guards.py
          rm .github/workflows/runtime-guards-bootstrap.yml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Refresh Rust lockfile
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 1
          fi
          git commit -m "feat: harden isolated runtime resource controls"
          git push origin HEAD:work/runtime-guards-v2
