name: Local Agent Runtime Hardening

on:
  push:
    branches:
      - project-local-agent-e2e

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: project-local-agent-e2e
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch local completion URL and generation cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/local_agent.rs')
          text = path.read_text()

          old = '''    emit_agent_chunk(
        app,
        state,
        conversation_id,
        &assistant.id,
        &format!("{intro}\\n\\n"),
    )?;

    let loop_result = async {'''
          new = '''    if let Err(error) = emit_agent_chunk(
        app,
        state,
        conversation_id,
        &assistant.id,
        &format!("{intro}\\n\\n"),
    ) {
        state.active_generations.finish(conversation_id);
        return Err(error);
    }

    let loop_result = async {'''
          if old not in text:
              raise SystemExit('intro emit anchor missing')
          text = text.replace(old, new, 1)

          old = '''    finish_agent_message(app, state, conversation_id, &assistant.id, status)?;
    state.active_generations.finish(conversation_id);
    latest_message(state, conversation_id, &assistant.id)'''
          new = '''    let finish_result = finish_agent_message(app, state, conversation_id, &assistant.id, status);
    state.active_generations.finish(conversation_id);
    finish_result?;
    latest_message(state, conversation_id, &assistant.id)'''
          if old not in text:
              raise SystemExit('finish anchor missing')
          text = text.replace(old, new, 1)

          old = '''    let response = client
        .post(endpoint)
        .json(&body)
        .send()
        .await
        .map_err(|error| {
            AppError::InferenceFailed(format!("agent model request failed: {error}"))
        })?;'''
          new = '''    let url = format!("{}/v1/chat/completions", endpoint.trim_end_matches('/'));
    let mut retry = 0u8;
    let response = loop {
        let response = client
            .post(&url)
            .json(&body)
            .send()
            .await
            .map_err(|error| {
                AppError::InferenceFailed(format!("agent model request failed: {error}"))
            })?;
        if response.status() == reqwest::StatusCode::SERVICE_UNAVAILABLE && retry < 5 {
            retry += 1;
            tokio::time::sleep(Duration::from_millis(600)).await;
            continue;
        }
        break response;
    };'''
          if old not in text:
              raise SystemExit('completion request anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit hardening
        run: |
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/src/local_agent.rs
          git diff --cached --check
          git commit -m "fix(agent): use llama chat endpoint and clean cancellation state"
          git push
