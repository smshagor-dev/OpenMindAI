name: Materialize vision model integration

on:
  push:
    branches:
      - vision-model-package-integration

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: vision-model-package-integration

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply source integration
        run: |
          python scripts/apply_vision_model_integration.py
          python - <<'PY'
          from pathlib import Path

          chat = Path("src/lib/chat.ts")
          text = chat.read_text(encoding="utf-8")
          text = text.replace(
              "const bitmap = await createImageBitmap(file);",
              "const bitmap = await window.createImageBitmap(file);",
          )
          text = text.replace(
              'const safeName = file.name.replace(/[\\]\\r\\n]/g, " ").replace(/\\]/g, " ");',
              'const safeName = file.name.replaceAll("]", " ").replace(/[\\r\\n]/g, " ");',
          )
          chat.write_text(text, encoding="utf-8")

          inference = Path("src-tauri/src/inference.rs")
          text = inference.read_text(encoding="utf-8")
          text = text.replace(
              "struct InlineDataImage {\n    alt: String,\n    data_url: String,\n}",
              "struct InlineDataImage {\n    data_url: String,\n}",
          )
          text = text.replace(
              "        images.push(InlineDataImage {\n            alt,\n            data_url: url.to_string(),\n        });",
              "        images.push(InlineDataImage {\n            data_url: url.to_string(),\n        });",
          )
          text = text.replace('        assert_eq!(images[0].alt, "screen.png");\n', "")
          text = text.replace(
              '            vec![InlineDataImage {\n                alt: "screen.png".to_string(),\n                data_url: "data:image/png;base64,QUJDRA==".to_string(),\n            }],',
              '            vec![InlineDataImage {\n                data_url: "data:image/png;base64,QUJDRA==".to_string(),\n            }],',
          )
          inference.write_text(text, encoding="utf-8")
          PY

      - name: Format changed sources
        run: |
          npx --yes prettier --write src/lib/chat.ts src/App.tsx
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Remove one-off materializer
        run: |
          rm scripts/apply_vision_model_integration.py
          rm .github/workflows/materialize-vision-model-integration.yml

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement local multimodal vision pipeline"
          git push origin HEAD:vision-model-package-integration
