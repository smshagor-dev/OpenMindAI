name: Materialize vision model integration

on:
  push:
    branches:
      - vision-model-package-integration

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: vision-model-package-integration

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply source integration
        run: python scripts/apply_vision_model_integration.py

      - name: Format changed sources
        run: |
          npx --yes prettier --write src/lib/chat.ts src/App.tsx
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Remove one-off materializer
        run: |
          rm scripts/apply_vision_model_integration.py
          rm .github/workflows/materialize-vision-model-integration.yml

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement local multimodal vision pipeline"
          git push origin HEAD:vision-model-package-integration
