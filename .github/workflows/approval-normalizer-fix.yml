name: Approval Normalizer Fix

on:
  push:
    branches:
      - fix/connected-agent-ci-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch approval normalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/connected_agent.rs')
          text = path.read_text()
          old = '''fn normalize_reply(content: &str) -> String {
              content
                  .trim()
                  .to_ascii_lowercase()
                  .trim_matches(|character: char| matches!(character, '.' | '!' | '?' | ','))
                  .split_whitespace()
                  .collect::<Vec<_>>()
                  .join(" ")
          }
          '''
          new = '''fn normalize_reply(content: &str) -> String {
              content
                  .trim()
                  .to_ascii_lowercase()
                  .replace(['.', '!', '?', ','], " ")
                  .split_whitespace()
                  .collect::<Vec<_>>()
                  .join(" ")
          }
          '''
          assert text.count(old) == 1, f'normalize_reply occurrences: {text.count(old)}'
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features connected_agent::tests::approval_words_are_narrow
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/connected_agent.rs
          git commit -m 'fix(agent): normalize approval punctuation safely'
          git push origin HEAD:fix/connected-agent-ci-final
