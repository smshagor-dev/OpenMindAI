name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows signed release
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require tag on current main
        shell: pwsh
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          $tagCommit = (git rev-parse HEAD).Trim()
          $mainCommit = (git rev-parse origin/main).Trim()
          if ($tagCommit -ne $mainCommit) {
            throw "Release tag must point at the current main commit. tag=$tagCommit main=$mainCommit"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate synchronized release version
        shell: pwsh
        run: npm run check:version -- --tag $env:GITHUB_REF_NAME

      - name: Validate release and updater configuration
        run: npm run check:release

      - name: Frontend lint
        run: npm run lint

      - name: Frontend production build
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Validate signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for production updater artifacts."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw "WINDOWS_CERTIFICATE must contain the base64-encoded Authenticode PFX."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required."
          }

      - name: Import Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "openmindai-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate) {
            throw "The Authenticode certificate could not be imported."
          }
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 10
          Set-Content -Path "src-tauri/tauri.windows-ci.conf.json" -Value $config -Encoding utf8
          Remove-Item -LiteralPath $pfxPath -Force

      - name: Build and upload signed Tauri draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: OpenMindAI v__VERSION__
          releaseBody: |
            OpenMindAI production release candidate generated by the signed release pipeline.

            The draft is kept private until the Authenticode signature, updater metadata/signature, checksums, and manual clean-machine update/install gates are verified.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.windows-ci.conf.json

      - name: Verify signed release asset contract
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $expectedVersion = $tag.TrimStart('v')
          $release = gh release view $tag --json isDraft,tagName | ConvertFrom-Json
          if ($release.tagName -ne $tag) {
            throw "Draft release tag mismatch."
          }
          if (-not $release.isDraft) {
            throw "Release must remain a draft until manual trust gates pass."
          }

          $assetDir = Join-Path $env:RUNNER_TEMP "openmindai-release-assets"
          if (Test-Path $assetDir) { Remove-Item $assetDir -Recurse -Force }
          New-Item -ItemType Directory -Path $assetDir | Out-Null
          gh release download $tag --dir $assetDir --clobber

          $installers = @(Get-ChildItem -Path $assetDir -File | Where-Object { $_.Name -like "*-setup.exe" })
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup.exe asset, found $($installers.Count)."
          }
          $installer = $installers[0]
          $signaturePath = "$($installer.FullName).sig"
          $latestPath = Join-Path $assetDir "latest.json"
          if (-not (Test-Path -LiteralPath $signaturePath)) {
            throw "Updater signature asset is missing for $($installer.Name)."
          }
          if (-not (Test-Path -LiteralPath $latestPath)) {
            throw "latest.json updater metadata is missing."
          }

          $authenticode = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($authenticode.Status -ne 'Valid') {
            throw "Authenticode verification failed for $($installer.Name): $($authenticode.Status) $($authenticode.StatusMessage)"
          }

          $latest = Get-Content -LiteralPath $latestPath -Raw | ConvertFrom-Json
          if ($latest.version -ne $expectedVersion) {
            throw "latest.json version $($latest.version) does not match tag version $expectedVersion."
          }
          $windows = $latest.platforms.'windows-x86_64'
          if ($null -eq $windows) {
            throw "latest.json is missing platforms.windows-x86_64."
          }
          if ([string]::IsNullOrWhiteSpace($windows.signature)) {
            throw "latest.json contains an empty Windows updater signature."
          }
          $signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          if ($windows.signature.Trim() -ne $signature) {
            throw "latest.json signature does not match the uploaded .sig asset."
          }
          try {
            $updateUri = [Uri]$windows.url
          } catch {
            throw "latest.json Windows updater URL is invalid."
          }
          if ($updateUri.Scheme -ne 'https') {
            throw "latest.json Windows updater URL must use HTTPS."
          }
          if ($updateUri.Host -ne 'github.com') {
            throw "latest.json Windows updater URL must point to github.com."
          }
          if (-not $updateUri.AbsolutePath.Contains("/releases/download/$tag/")) {
            throw "latest.json Windows updater URL does not point to the tagged release."
          }
          $urlAssetName = [Uri]::UnescapeDataString([IO.Path]::GetFileName($updateUri.AbsolutePath))
          if ($urlAssetName -ne $installer.Name) {
            throw "latest.json points to $urlAssetName but the signed installer is $($installer.Name)."
          }

          $checksumPath = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          $lines = Get-ChildItem -Path $assetDir -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          if ($lines.Count -lt 3) {
            throw "Release asset set is incomplete; expected installer, signature, and latest.json."
          }
          Set-Content -Path $checksumPath -Value $lines -Encoding ascii
          gh release upload $tag $checksumPath --clobber

          $assetNames = @((gh release view $tag --json assets | ConvertFrom-Json).assets | ForEach-Object { $_.name })
          foreach ($required in @($installer.Name, "$($installer.Name).sig", "latest.json", "SHA256SUMS.txt")) {
            if ($required -notin $assetNames) {
              throw "Verified release asset missing after upload: $required"
            }
          }

      - name: Remove imported certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/tauri.windows-ci.conf.json") {
            $config = Get-Content "src-tauri/tauri.windows-ci.conf.json" -Raw | ConvertFrom-Json
            $thumbprint = $config.bundle.windows.certificateThumbprint
            if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
              Get-ChildItem Cert:\CurrentUser\My\$thumbprint -ErrorAction SilentlyContinue | Remove-Item -Force
            }
            Remove-Item "src-tauri/tauri.windows-ci.conf.json" -Force
          }
