name: V3 Signing Secret Preflight

on:
  push:
    branches:
      - "release/v3.0.0-readiness"
    paths:
      - ".github/workflows/v3-signing-secret-preflight.yml"

permissions:
  contents: write

jobs:
  signing-preflight:
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v3.0.0-readiness
          fetch-depth: 0

      - name: Report signing material presence
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              echo "$name=present"
              echo "- ✅ $name configured" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$name=missing"
              echo "- ❌ $name missing" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          echo "## OpenMindAI v3 signing preflight" >> "$GITHUB_STEP_SUMMARY"
          check TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
          check TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          check WINDOWS_CERTIFICATE "$WINDOWS_CERTIFICATE"
          check WINDOWS_CERTIFICATE_PASSWORD "$WINDOWS_CERTIFICATE_PASSWORD"

      - name: Remove one-shot preflight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v3-signing-secret-preflight.yml
          git commit -m "chore(release): remove signing secret preflight"
          git push origin HEAD:release/v3.0.0-readiness
