name: Project Workspace Preflight

on:
  push:
    branches:
      - projects-workspace-polish
    paths:
      - .github/workflows/projects-preflight.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: projects-workspace-polish
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend lint
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - name: Remove preflight workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/projects-preflight.yml
          git config user.name openmindai-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove project workspace preflight"
          git push origin HEAD:projects-workspace-polish
