name: Local Agent Compile Fix

on:
  push:
    branches:
      - project-local-agent-e2e

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: project-local-agent-e2e
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch compile blockers
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path('src-tauri/src/local_workspace.rs')
          text = workspace.read_text()
          old = "fn lock_database(state: &State<AppState>) -> Result<std::sync::MutexGuard<'_, Database>, AppError> {"
          new = "fn lock_database<'a, 'r>(state: &'a State<'r, AppState>) -> Result<std::sync::MutexGuard<'a, Database>, AppError> {"
          if old not in text:
              raise SystemExit('lock_database anchor missing')
          workspace.write_text(text.replace(old, new, 1))

          agent = Path('src-tauri/src/local_agent.rs')
          text = agent.read_text()
          old = '    run_agent_message(&app, &state, &conversation_id, &user.content, Some(user)).await\n'
          new = '    let content = user.content.clone();\n    run_agent_message(&app, &state, &conversation_id, &content, Some(user)).await\n'
          if old not in text:
              raise SystemExit('regenerate anchor missing')
          agent.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit fixes
        run: |
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/src/local_workspace.rs src-tauri/src/local_agent.rs
          git diff --cached --check
          git commit -m "fix(agent): resolve Rust compile blockers"
          git push
