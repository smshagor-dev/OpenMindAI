name: Project Agent Platform Patch

on:
  push:
    branches:
      - feature/project-agent-autonomy-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/project-agent-autonomy-hardening

      - name: Add platform-aware terminal context
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/local_agent.rs')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          terminal_rule_anchor = '''    let terminal_rule = if context.workspace.full_pc_access {\n        "terminal is AVAILABLE. Keep commands focused on the user's task and workspace. Catastrophic filesystem-root/disk commands are blocked."\n    } else {\n        "terminal is NOT AVAILABLE. Use filesystem tools only."\n    };\n\n    let system = format!(\n'''
          terminal_rule_replacement = '''    let terminal_rule = if context.workspace.full_pc_access {\n        "terminal is AVAILABLE. Keep commands focused on the user's task and workspace. Catastrophic filesystem-root/disk commands are blocked."\n    } else {\n        "terminal is NOT AVAILABLE. Use filesystem tools only."\n    };\n    let platform_rule = if cfg!(target_os = "windows") {\n        "Host OS: Windows. terminal uses Windows PowerShell (powershell.exe -NoProfile -NonInteractive). Use PowerShell-compatible syntax."\n    } else if cfg!(target_os = "macos") {\n        "Host OS: macOS. terminal uses /bin/sh -lc. Use POSIX shell-compatible syntax."\n    } else {\n        "Host OS: Linux. terminal uses /bin/sh -lc. Use POSIX shell-compatible syntax."\n    };\n\n    let system = format!(\n'''
          replace_once(terminal_rule_anchor, terminal_rule_replacement, 'platform rule')

          replace_once(
              '''- For dependency installs or heavy builds, set timeoutSec as needed up to 600 seconds.\\n\\\n- After changing workspace files, do not finalize before a successful applicable validation.''',
              '''- For dependency installs or heavy builds, set timeoutSec as needed up to 600 seconds. Avoid interactive prompts, pagers, editors, sudo/password prompts, and commands that wait for user input.\\n\\\n- Follow the host shell syntax described below; do not assume Bash on Windows or PowerShell on macOS/Linux.\\n\\\n- After changing workspace files, do not finalize before a successful applicable validation.''',
              'terminal interaction rules',
          )

          replace_once(
              '''- {terminal_rule}\\n\\\nAttached roots:\\n{root_summary}"\n''',
              '''- {terminal_rule}\\n\\\n- {platform_rule}\\n\\\nAttached roots:\\n{root_summary}"\n''',
              'platform prompt insertion',
          )

          path.write_text(text)
          PY

      - name: Format and validate
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
          grep -q 'Host OS: Windows' src-tauri/src/local_agent.rs
          grep -q 'PowerShell-compatible syntax' src-tauri/src/local_agent.rs

      - name: Commit patch and remove helper
        run: |
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/src/local_agent.rs
          git rm .github/workflows/project-agent-platform-patch.yml
          git diff --cached --check
          git commit -m "feat(agent): make terminal planning platform aware"
          git push origin HEAD:feature/project-agent-autonomy-hardening
