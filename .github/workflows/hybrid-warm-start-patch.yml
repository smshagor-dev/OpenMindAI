name: Hybrid Warm Start Patch

on:
  push:
    branches:
      - perf/hybrid-warm-start

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/hybrid-warm-start
          fetch-depth: 1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Integrate hybrid warm start
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src-tauri/src/lib.rs',
              'mod vision_batch;\n\npub(crate) use connected_agent::{',
              'mod vision_batch;\nmod warm_start;\n\npub(crate) use connected_agent::{',
              'register warm_start module',
          )

          replace_once(
              'src-tauri/src/inference.rs',
              '''    pub fn finish(&self, conversation_id: &str) {\n        if let Ok(mut tokens) = self.tokens.lock() {\n            tokens.remove(conversation_id);\n        }\n    }\n}\n''',
              '''    pub fn finish(&self, conversation_id: &str) {\n        if let Ok(mut tokens) = self.tokens.lock() {\n            tokens.remove(conversation_id);\n        }\n    }\n\n    pub fn is_idle(&self) -> bool {\n        self.tokens.lock().map_or(true, |tokens| tokens.is_empty())\n    }\n}\n''',
              'active generation idle state',
          )
          replace_once(
              'src-tauri/src/inference.rs',
              '''        "max_tokens": config.max_tokens,\n        "presence_penalty": config.presence_penalty,\n        "chat_template_kwargs": {\n''',
              '''        "max_tokens": config.max_tokens,\n        "presence_penalty": config.presence_penalty,\n        // Keep llama-server's KV prompt cache enabled so the shared prefix of\n        // an ongoing conversation can be reused instead of fully prefilling\n        // it on every turn.\n        "cache_prompt": true,\n        "chat_template_kwargs": {\n''',
              'prompt cache request hint',
          )

          legacy = 'src-tauri/src/lib_legacy.rs'
          replace_once(
              legacy,
              '''    active_generations: ActiveGenerations,\n    http: Client,\n}\n''',
              '''    active_generations: ActiveGenerations,\n    warm_start: warm_start::WarmStartCoordinator,\n    http: Client,\n}\n''',
              'app warm coordinator state',
          )
          replace_once(
              legacy,
              '''        let mut runtime = state\n            .runtime\n            .lock()\n            .map_err(|_| app_error::AppError::internal("runtime lock poisoned"))?;\n        runtime.ensure_model_server(&hardware, &plan.config)?\n    };\n\n    let db = state\n''',
              '''        let mut runtime = state\n            .runtime\n            .lock()\n            .map_err(|_| app_error::AppError::internal("runtime lock poisoned"))?;\n        let status = runtime.ensure_model_server(&hardware, &plan.config)?;\n        state.warm_start.mark_runtime_ready(&model.id);\n        status\n    };\n\n    let db = state\n''',
              'activate model warm state',
          )
          replace_once(
              legacy,
              '''        let status = runtime.ensure_model_server(&hardware, &plan.config)?;\n        status.endpoint.ok_or_else(|| {\n            app_error::AppError::InferenceServerUnavailable("runtime endpoint missing".to_string())\n        })?\n''',
              '''        let status = runtime.ensure_model_server(&hardware, &plan.config)?;\n        state.warm_start.mark_runtime_ready(&model.id);\n        status.endpoint.ok_or_else(|| {\n            app_error::AppError::InferenceServerUnavailable("runtime endpoint missing".to_string())\n        })?\n''',
              'generation warm state',
          )
          replace_once(
              legacy,
              '''    let routing = resolve_conversation_model(&state, &conversation_id, &mode, trimmed)?;\n    let model = routing.model;\n    sync_project_context(&state, &conversation_id)?;\n''',
              '''    let routing = resolve_conversation_model(&state, &conversation_id, &mode, trimmed)?;\n    let model = routing.model;\n    state.warm_start.note_foreground_request(&model.id);\n    state.warm_start.wait_if_loading(&model.id).await;\n    sync_project_context(&state, &conversation_id)?;\n''',
              'send first-message warm queue',
          )
          replace_once(
              legacy,
              '''    let routing = resolve_conversation_model(&state, &conversation_id, &mode, &user.content)?;\n    let model = routing.model;\n    sync_project_context(&state, &conversation_id)?;\n''',
              '''    let routing = resolve_conversation_model(&state, &conversation_id, &mode, &user.content)?;\n    let model = routing.model;\n    state.warm_start.note_foreground_request(&model.id);\n    state.warm_start.wait_if_loading(&model.id).await;\n    sync_project_context(&state, &conversation_id)?;\n''',
              'regenerate warm queue',
          )
          replace_once(
              legacy,
              '''fn stop_llama_runtime(state: State<AppState>) -> Result<(), app_error::AppError> {\n    let mut runtime = state\n        .runtime\n        .lock()\n        .map_err(|_| app_error::AppError::internal("runtime lock poisoned"))?;\n    runtime.stop()\n}\n''',
              '''fn stop_llama_runtime(state: State<AppState>) -> Result<(), app_error::AppError> {\n    let mut runtime = state\n        .runtime\n        .lock()\n        .map_err(|_| app_error::AppError::internal("runtime lock poisoned"))?;\n    runtime.stop()?;\n    state.warm_start.mark_runtime_stopped();\n    Ok(())\n}\n''',
              'manual runtime stop warm state',
          )
          replace_once(
              legacy,
              '''            runtime_installer,\n            active_generations: ActiveGenerations::default(),\n            http: Client::new(),\n        })\n        .invoke_handler(tauri::generate_handler![\n''',
              '''            runtime_installer,\n            active_generations: ActiveGenerations::default(),\n            warm_start: warm_start::WarmStartCoordinator::default(),\n            http: Client::new(),\n        })\n        .setup(|app| {\n            // Do not block window creation. Load only the lightweight Core model\n            // in the background and keep it resident for ChatGPT-like first-turn\n            // responsiveness. Heavy/vision/media models remain on-demand.\n            warm_start::spawn_background_services(app.handle().clone());\n            Ok(())\n        })\n        .invoke_handler(tauri::generate_handler![\n''',
              'spawn startup warm services',
          )

          warm = Path('src-tauri/src/warm_start.rs')
          text = warm.read_text(encoding='utf-8')
          old = '''    pub fn mark_runtime_ready(&self, model_id: &str) {\n        if let Ok(mut state) = self.state.lock() {\n            state.phase = WarmPhase::Ready;\n            state.model_id = Some(model_id.to_string());\n        }\n        self.notify.notify_waiters();\n    }\n'''
          new = old + '''\n    pub fn mark_runtime_stopped(&self) {\n        if let Ok(mut state) = self.state.lock() {\n            state.phase = WarmPhase::Idle;\n            state.model_id = None;\n        }\n        self.notify.notify_waiters();\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('warm coordinator stop reset: expected exactly one match')
          warm.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml warm_start::tests

      - name: Commit production changes and remove helper
        shell: bash
        run: |
          rm .github/workflows/hybrid-warm-start-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src-tauri/src/lib_legacy.rs src-tauri/src/inference.rs src-tauri/src/warm_start.rs .github/workflows/hybrid-warm-start-patch.yml
          git commit -m "perf(chat): preload core model in background"
          git push origin HEAD:perf/hybrid-warm-start
