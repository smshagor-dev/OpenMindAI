name: Chat Finalizer

on:
  push:
    branches:
      - chat-production-readiness
    paths:
      - .github/workflows/chat-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply final chat integrity patches
        shell: python
        run: |
          from pathlib import Path

          app = Path("src/App.tsx")
          text = app.read_text(encoding="utf-8")
          old = '''        const branch = messages.slice(targetIndex);
          editedBranchChanged = branch.length > 0;
          for (const message of branch.slice().reverse()) {
            await api.deleteMessage(message.id);
          }
          setMessages((items) => {
'''
          new = '''        const branch = messages.slice(targetIndex);
          editedBranchChanged = branch.length > 0;
          // Deleting the edited user turn is a single repository-level branch
          // truncation. Do not issue one delete per later message: a crash
          // between calls could otherwise leave a partially edited history.
          await api.deleteMessage(editTargetId);
          setMessages((items) => {
'''
          if old not in text:
              raise SystemExit("App.tsx edit/resend snippet not found")
          app.write_text(text.replace(old, new, 1), encoding="utf-8")

          lib = Path("src-tauri/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          old = '''#[tauri::command]
fn delete_conversation(id: String, state: State<AppState>) -> Result<(), app_error::AppError> {
    let db = state
        .database
        .lock()
        .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
    ChatRepository::new(&db).delete_conversation(&id)
}
'''
          new = '''#[tauri::command]
fn delete_conversation(id: String, state: State<AppState>) -> Result<(), app_error::AppError> {
    // Generated artifacts live outside SQLite, so FK cascade alone is not
    // sufficient. Resolve every recorded path through the portable-root guard
    // before deleting the database rows, then remove the files after the
    // cascade succeeds. A cleanup failure is logged without resurrecting a
    // conversation whose relational state has already been deleted.
    let artifact_paths = {
        let db = state
            .database
            .lock()
            .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
        let artifact_paths = ArtifactRepository::new(&db)
            .list_for_conversation(&id)?
            .into_iter()
            .map(|artifact| artifact.path)
            .collect::<Vec<_>>();
        ChatRepository::new(&db).delete_conversation(&id)?;
        artifact_paths
    };

    for relative in artifact_paths {
        match state.root.resolve_relative(&relative) {
            Ok(path) if path.is_file() => {
                if let Err(error) = std::fs::remove_file(&path) {
                    tracing::warn!(path = %path.display(), %error, "could not remove deleted chat artifact file");
                }
            }
            Ok(_) => {}
            Err(error) => {
                tracing::warn!(path = %relative, %error, "ignored invalid deleted chat artifact path");
            }
        }
    }
    Ok(())
}
'''
          if old not in text:
              raise SystemExit("lib.rs delete_conversation snippet not found")
          lib.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Validate patch
        run: |
          git diff --check
          grep -q "await api.deleteMessage(editTargetId);" src/App.tsx
          grep -q "could not remove deleted chat artifact file" src-tauri/src/lib.rs

      - name: Commit final patch and remove workflow
        run: |
          git config user.name "OpenMindAI CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/chat-finalize.yml
          git add src/App.tsx src-tauri/src/lib.rs src-tauri/src/chat.rs
          git commit -m "fix(chat): finalize atomic edit and artifact cleanup"
          git push origin HEAD:chat-production-readiness
