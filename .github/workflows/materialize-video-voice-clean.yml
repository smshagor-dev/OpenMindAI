name: Materialize clean video and voice production branch

on:
  push:
    branches:
      - video-voice-production-clean
    paths:
      - .github/workflows/materialize-video-voice-clean.yml

permissions:
  contents: write

concurrency:
  group: materialize-video-voice-clean
  cancel-in-progress: true

jobs:
  materialize-validate-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: video-voice-production-clean
          fetch-depth: 0

      - name: Transplant validated production files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/end-to-end-video-voice-runtime:refs/remotes/origin/end-to-end-video-voice-runtime
          source_ref=refs/remotes/origin/end-to-end-video-voice-runtime
          git checkout "$source_ref" -- \
            src-tauri/Cargo.lock \
            src-tauri/Cargo.toml \
            src-tauri/model-catalog.json \
            src-tauri/src/artifacts.rs \
            src-tauri/src/diffusion_runtime.rs \
            src-tauri/src/lib.rs \
            src-tauri/src/model_catalog.rs \
            src-tauri/src/model_download.rs \
            src-tauri/src/model_package.rs \
            src-tauri/src/voice_runtime.rs \
            src/App.tsx \
            src/lib/chat.ts
          rm -f \
            .github/workflows/apply-video-voice-runtime.yml \
            clippy-summary.txt \
            rust-test-summary.txt \
            scripts/apply_video_voice_runtime.py \
            scripts/fix_video_voice_clippy.py \
            .github/workflows/materialize-video-voice-clean.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend format check
        run: npx prettier --check src/App.tsx src/lib/chat.ts

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf cmake build-essential pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Diff hygiene
        run: git diff --check

      - name: Commit clean production implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement end-to-end local video and voice generation"
          git push origin HEAD:video-voice-production-clean
