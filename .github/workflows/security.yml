name: Security

on:
  push:
    branches:
      - main
      - production-readiness-completion
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Validate production ZIP audit mode
        id: zip_mode
        run: |
          node scripts/check-zip-audit-mode.mjs --self-test
          node scripts/check-zip-audit-mode.mjs

      - name: Check temporary legacy ZIP exception scope
        if: steps.zip_mode.outputs.mode == 'legacy'
        run: node scripts/check-transitive-zip-audit.mjs

      - name: Inspect pinned legacy ZIP consumer sources
        if: steps.zip_mode.outputs.mode == 'legacy'
        run: |
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > "$RUNNER_TEMP/openmind-cargo-metadata.json"
          node scripts/check-upstream-zip-source.mjs "$RUNNER_TEMP/openmind-cargo-metadata.json"

      - name: Inspect pinned migrated ZIP 9 vendor sources
        if: steps.zip_mode.outputs.mode == 'remediated'
        run: |
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > "$RUNNER_TEMP/openmind-cargo-metadata.json"
          node scripts/check-zip-audit-mode.mjs --metadata "$RUNNER_TEMP/openmind-cargo-metadata.json"

      - name: Cargo audit (temporary, scoped ZIP 7 exceptions)
        if: steps.zip_mode.outputs.mode == 'legacy'
        # This branch only runs while the exact vulnerable registry crates and
        # ZIP 7.2.0 remain. Unknown ZIP versions fail the mode guard above.
        run: |
          cargo audit --file src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369

      - name: Cargo audit (migrated production graph, no exceptions)
        if: steps.zip_mode.outputs.mode == 'remediated'
        run: cargo audit --file src-tauri/Cargo.lock

  codeql:
    name: CodeQL
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
