name: Security

on:
  push:
    branches:
      - main
      - production-readiness-completion
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Verify ZIP 9-only production dependency graph
        run: |
          node scripts/check-zip-audit-mode.mjs --self-test
          node scripts/check-zip-audit-mode.mjs

      - name: Verify exact vendored ZIP 9 sources and third-party notices
        run: |
          python3 scripts/verify-zip9-vendor.py --self-test
          python3 scripts/verify-zip9-vendor.py

      - name: Inspect committed path-pinned ZIP 9 dependencies
        run: |
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > "$RUNNER_TEMP/openmind-cargo-metadata.json"
          node scripts/check-zip-audit-mode.mjs --metadata "$RUNNER_TEMP/openmind-cargo-metadata.json"

      - name: Cargo audit (production, no advisory exceptions)
        run: cargo audit --file src-tauri/Cargo.lock

  codeql:
    name: CodeQL
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
