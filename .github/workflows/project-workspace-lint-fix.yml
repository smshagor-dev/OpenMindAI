name: Project Workspace Lint Fix

on:
  push:
    branches:
      - project-local-workspace-access
    paths:
      - .github/workflows/project-workspace-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: project-local-workspace-access
      - name: Remove unused import
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/components/ProjectLocalWorkspace.tsx")
          text = path.read_text()
          text = text.replace("  AlertTriangle,\n", "", 1)
          path.write_text(text)
          Path(".github/workflows/project-workspace-lint-fix.yml").unlink()
      - name: Commit fix
        shell: bash
        run: |
          git config user.name openmindai-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix(projects): clean local workspace lint"
          git push origin HEAD:project-local-workspace-access
