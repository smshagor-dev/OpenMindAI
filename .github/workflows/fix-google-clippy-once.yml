name: Fix Google Clippy once

on:
  push:
    branches:
      - connected-agent-e2e-stabilization

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: connected-agent-e2e-stabilization

      - name: Remove redundant AppError conversion
        shell: python
        run: |
          from pathlib import Path
          path = Path('src-tauri/src/google_workspace.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    timeout(Duration::from_secs(OAUTH_TIMEOUT_SECS), work)\n        .await\n        .map_err(|_| connector_error("Google authorization timed out"))?\n        .map_err(AppError::from)\n'''
          new = '''    timeout(Duration::from_secs(OAUTH_TIMEOUT_SECS), work)\n        .await\n        .map_err(|_| connector_error("Google authorization timed out"))?\n'''
          if old not in text:
              raise SystemExit('expected Clippy target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove helper and commit fix
        shell: bash
        run: |
          git rm .github/workflows/fix-google-clippy-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/google_workspace.rs
          git commit -m "fix(connectors): remove redundant AppError conversion"
          git push origin HEAD:connected-agent-e2e-stabilization
