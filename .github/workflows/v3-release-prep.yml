name: V3 Release Prep

on:
  push:
    branches:
      - "release/v3.0.0-readiness"
    paths:
      - ".github/workflows/v3-release-prep.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release/v3.0.0-readiness
          fetch-depth: 0

      - name: Prepare v3.0.0 source and release contract
        run: python3 scripts/prepare-v3-release.py

      - name: Validate prepared release metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-version-consistency.mjs --tag v3.0.0
          node scripts/check-release-readiness.mjs
          bash -n OpenMindAI-Setup.command
          bash -n openmindai-setup.sh
          bash -n bootstrap/linux/bootstrap.sh
          bash -n bootstrap/macos/bootstrap.sh
          git diff --check

      - name: Commit v3 release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v3-release-prep.yml scripts/prepare-v3-release.py
          git add -A
          git commit -m "release: prepare OpenMindAI v3.0.0"
          git push origin HEAD:release/v3.0.0-readiness
