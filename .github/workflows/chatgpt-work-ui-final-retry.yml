name: ChatGPT-style Work UI Final Retry

on:
  push:
    branches:
      - fix/chatgpt-style-work-apps

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/chatgpt-style-work-apps
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply literal-safe production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/chatgpt-work-ui-finalize.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])

          pattern = re.compile(
              r"old_open = '''  const openAgentChat = async \(\) => \{.*?text = text\.replace\(old_open, new_open\)\n",
              re.S,
          )
          replacement = r'''open_start = text.index("  const openAgentChat = async () => {")
          open_end = text.index("\n  const linkConversation", open_start)
          new_open = """  const openAgentChat = async (draft?: string) => {
            const existing = projectConversations[0];
            if (existing) {
              props.onOpenConversation(existing.id, draft);
              return;
            }
            await createChat(draft);
          };
          """
          text = text[:open_start] + new_open + text[open_end:]
          '''
          script, count = pattern.subn(lambda _match: textwrap.dedent(replacement), script, count=1)
          if count != 1:
              raise SystemExit(f'Could not harden openAgentChat patch block: replacements={count}')
          exec(compile(script, 'chatgpt-work-ui-finalize', 'exec'))
          PY

      - name: Validate frontend
        run: |
          npm run lint
          npm run build

      - name: Verify user-facing action console removal
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "Connected Work" -n src docs
          ! grep -R "Work → GitHub\|Work → Google Workspace" -n src docs
          ! grep -R "Parameters (JSON)\|Run action" -n src/components
          test ! -e src/components/ConnectedWorkspace.tsx
          grep -q 'label: "Apps"' src/components/SettingsDialog.tsx
          grep -q 'What should I work on?' src/components/ProjectsWorkspace.tsx

      - name: Commit production changes only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/chatgpt-work-ui-finalize.yml .github/workflows/chatgpt-work-ui-retry.yml .github/workflows/chatgpt-work-ui-final-retry.yml
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(work): make apps internal and simplify project work"
          git push origin HEAD:fix/chatgpt-style-work-apps
