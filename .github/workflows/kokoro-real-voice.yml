name: Kokoro Real Voice Inference

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kokoro-real-voice.yml
      - scripts/kokoro-real-smoke.py
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/examples/media_smoke.rs
      - src-tauri/src/voice_runtime.rs
      - src-tauri/src/model_package.rs
      - src-tauri/src/model_download.rs
      - src-tauri/src/model_catalog.rs
      - src-tauri/model-catalog.json
      - vendor/any-tts-0.1.3/**
      - vendor/candle-core-0.10.2/**
  pull_request:
    paths:
      - .github/workflows/kokoro-real-voice.yml
      - scripts/kokoro-real-smoke.py
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/examples/media_smoke.rs
      - src-tauri/src/voice_runtime.rs
      - src-tauri/src/model_package.rs
      - src-tauri/src/model_download.rs
      - src-tauri/src/model_catalog.rs
      - src-tauri/model-catalog.json
      - vendor/any-tts-0.1.3/**
      - vendor/candle-core-0.10.2/**
  # Verify upstream model availability and inference stability weekly.
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kokoro-real-voice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-kokoro-voice:
    name: Load authentic Kokoro checkpoint and generate real WAV (Linux CPU)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache compiled Rust dependencies only
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate real audio QA rejects silence
        run: python scripts/kokoro-real-smoke.py self-test

      - name: Download authentic revision-pinned Kokoro model, voice and config
        env:
          OPENMINDAI_ROOT: ${{ runner.temp }}/openmind-kokoro-smoke
        run: |
          python scripts/kokoro-real-smoke.py prepare \
            --root "$OPENMINDAI_ROOT" --download

      - name: Invoke actual OpenMindAI Rust/Candle Kokoro synthesis
        env:
          OPENMINDAI_ROOT: ${{ runner.temp }}/openmind-kokoro-smoke
        run: |
          cargo run --locked --release \
            --manifest-path src-tauri/Cargo.toml \
            --example media_smoke -- speak --root "$OPENMINDAI_ROOT"

      - name: Verify generated real 24 kHz PCM16 speech is not silent
        env:
          OPENMINDAI_ROOT: ${{ runner.temp }}/openmind-kokoro-smoke
        run: |
          python scripts/kokoro-real-smoke.py verify-wav \
            --wav "$OPENMINDAI_ROOT/generated/smoke/speak-smoke.wav" \
            --evidence "$RUNNER_TEMP/kokoro-smoke-evidence.json"

      - name: Upload only safe inference evidence (never model weights or audio)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-real-candle-voice-evidence-linux
          path: ${{ runner.temp }}/kokoro-smoke-evidence.json
          if-no-files-found: error
          retention-days: 14


  real-kokoro-desktop:
    name: Generate authentic Kokoro speech (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout source-pinned production runtime
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache compiled Rust dependencies only
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: kokoro-native-${{ matrix.os }}

      - name: Verify WAV acceptance rejects silent audio
        run: python scripts/kokoro-real-smoke.py self-test

      - name: Download SHA-256-pinned real Kokoro model, voice and config
        shell: bash
        env:
          OPENMINDAI_ROOT: ${{ runner.temp }}/openmind-kokoro-smoke
        run: |
          python scripts/kokoro-real-smoke.py prepare \
            --root "$OPENMINDAI_ROOT" --download

      - name: Generate real Kokoro speech using production Rust/Candle
        shell: bash
        env:
          OPENMINDAI_ROOT: ${{ runner.temp }}/openmind-kokoro-smoke
        run: |
          cargo run --locked --release \
            --manifest-path src-tauri/Cargo.toml \
            --example media_smoke -- speak --root "$OPENMINDAI_ROOT"

      - name: Reject missing, silent or invalid generated audio
        shell: bash
        env:
          OPENMINDAI_ROOT: ${{ runner.temp }}/openmind-kokoro-smoke
        run: |
          python scripts/kokoro-real-smoke.py verify-wav \
            --wav "$OPENMINDAI_ROOT/generated/smoke/speak-smoke.wav" \
            --evidence "$RUNNER_TEMP/kokoro-smoke-evidence.json"

      - name: Upload only evidence, never model files or audio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-real-candle-voice-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/kokoro-smoke-evidence.json
          if-no-files-found: error
          retention-days: 14
