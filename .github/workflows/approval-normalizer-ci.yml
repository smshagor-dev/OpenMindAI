name: Approval Normalizer CI Fix

on:
  push:
    branches:
      - fix/approval-normalizer-ci

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/approval-normalizer-ci
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Patch narrow approval normalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/connected_agent.rs')
          text = path.read_text(encoding='utf-8')

          old = '''fn normalize_reply(content: &str) -> String {
              content
                  .trim()
                  .to_ascii_lowercase()
                  .trim_matches(|character: char| matches!(character, '.' | '!' | '?' | ','))
                  .split_whitespace()
                  .collect::<Vec<_>>()
                  .join(" ")
          }
          '''

          new = '''fn normalize_reply(content: &str) -> String {
              content
                  .trim()
                  .to_ascii_lowercase()
                  .chars()
                  .map(|character| {
                      if matches!(character, '.' | '!' | '?' | ',' | ';' | ':') {
                          ' '
                      } else {
                          character
                      }
                  })
                  .collect::<String>()
                  .split_whitespace()
                  .collect::<Vec<_>>()
                  .join(" ")
          }
          '''

          if text.count(old) != 1:
              raise SystemExit(f'normalize_reply matcher count: {text.count(old)}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Commit production source fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/approval-normalizer-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/connected_agent.rs .github/workflows/approval-normalizer-ci.yml
          git commit -m "fix(agent): normalize approval punctuation safely"
          git push origin HEAD:fix/approval-normalizer-ci
