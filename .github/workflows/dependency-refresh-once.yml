name: Refresh vulnerable Rust dependencies (one-time)

on:
  push:
    branches:
      - feature/web-search-reliability
    paths:
      - .github/workflows/dependency-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'smshagor-dev/OpenMindAI' && github.ref == 'refs/heads/feature/web-search-reliability'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Upgrade known patched Rust dependencies and resolve ZIP 9
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path src-tauri/Cargo.toml --package quinn-proto --precise 0.11.19
          cargo update --manifest-path src-tauri/Cargo.toml --package rustls --precise 0.23.46
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps >/dev/null
          git diff --stat -- src-tauri/Cargo.lock
      - name: Commit and push verified lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): resolve patched Rust dependencies in Cargo.lock"
          git push origin HEAD:feature/web-search-reliability
