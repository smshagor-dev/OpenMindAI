name: Apply Rust follow-up fixes

on:
  push:
    branches:
      - rust-cross-platform-validation-fix
    paths:
      - .github/workflows/apply-rust-follow-up.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout focused fix branch
        uses: actions/checkout@v4
        with:
          ref: rust-cross-platform-validation-fix

      - name: Apply precise source patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact anchor, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src-tauri/src/model_catalog.rs",
              '''pub fn dependency_path(
              root: &PortableRootManager,
              entry: &ModelCatalogEntry,
              role: &str,
          ) -> Option<String> {
              let download = entry.download.as_ref()?;
              let dependency = download
                  .dependencies
                  .iter()
                  .find(|dependency| dependency.role == role)?;
              let dir = root.resolve_relative(&download.destination_dir).ok()?;
              find_file_matching(&dir, &dependency.filename_pattern)
                  .and_then(|path| path.strip_prefix(root.root()).ok().map(Path::to_path_buf))
                  .map(|path| path.to_string_lossy().replace('\\\\', "/"))
          }

          ''',
              "",
          )

          replace_once(
              "src-tauri/src/inference.rs",
              '''fn extract_snippet(region: &str, marker: &str) -> Option<String> {
              let marker_index = region.find(marker)?;
              let tag_start = region[..marker_index].rfind('<')?;
              let tag_end_relative = region[tag_start..].find('>')?;
              let content_start = tag_start + tag_end_relative + 1;
              let close_relative = region[content_start..].find("</")?;
              let content_end = content_start + close_relative;
              let snippet = clean_html_text(&region[content_start..content_end]);
              (!snippet.is_empty()).then_some(snippet)
          }
          ''',
              '''fn extract_snippet(region: &str, marker: &str) -> Option<String> {
              let marker_index = region.find(marker)?;
              let tag_start = region[..marker_index].rfind('<')?;
              let tag_end_relative = region[tag_start..].find('>')?;
              let tag_end = tag_start + tag_end_relative;
              let opening_tag = &region[tag_start + 1..tag_end];
              let tag_name = opening_tag.split_whitespace().next()?.trim_start_matches('/');
              if tag_name.is_empty() {
                  return None;
              }

              let content_start = tag_end + 1;
              let closing_tag = format!("</{tag_name}>");
              let close_relative = region[content_start..].find(&closing_tag)?;
              let content_end = content_start + close_relative;
              let snippet = clean_html_text(&region[content_start..content_end]);
              (!snippet.is_empty()).then_some(snippet)
          }
          ''',
          )

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit follow-up fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/model_catalog.rs src-tauri/src/inference.rs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Fix Rust Clippy and search parsing"
          git push origin HEAD:rust-cross-platform-validation-fix
