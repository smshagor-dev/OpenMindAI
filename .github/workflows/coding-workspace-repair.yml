name: OpenAgent Parallel Sub-Agent Repair

on:
  push:
    branches:
      - work/openagent-parallel-repair

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize integration bootstrap
        run: python3 scripts/normalize_coding_bootstrap.py

      - name: Apply production integration
        run: python3 scripts/integrate_coding_workspace.py

      - name: Apply compile repairs
        run: python3 scripts/fix_coding_workspace_compile.py

      - name: Integrate parallel sub-agents
        run: python3 scripts/integrate_parallel_subagents.py

      - name: Remove one-shot files
        run: |
          rm -f scripts/normalize_coding_bootstrap.py
          rm -f scripts/integrate_coding_workspace.py
          rm -f scripts/fix_coding_workspace_compile.py
          rm -f scripts/integrate_parallel_subagents.py
          rm -f .github/workflows/coding-workspace-validation.yml
          rm -f .github/workflows/coding-workspace-repair.yml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf bubblewrap

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | tee clippy-output.txt

      - name: Persist Clippy diagnostics
        if: failure() && steps.clippy.outcome == 'failure'
        run: |
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f clippy-output.txt
          git commit -m "ci: capture clippy failure"
          git push origin HEAD:work/openagent-parallel-repair

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Deterministic coding evaluation
        run: python3 scripts/coding_workspace_eval.py

      - name: Adversarial security evaluation
        run: python3 scripts/coding_security_suite.py

      - name: Diff safety
        run: git diff --check

      - name: Commit verified coding workspace
        run: |
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate parallel OpenAgent sub-agents"
          git push origin HEAD:work/openagent-parallel-repair
