name: OpenAgent Parallel Sub-Agent Repair

on:
  push:
    branches:
      - work/openagent-parallel-repair

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize integration bootstrap
        run: python3 scripts/normalize_coding_bootstrap.py

      - name: Normalize current context API drift
        run: python3 scripts/normalize_parallel_bootstrap.py

      - name: Apply production integration
        run: python3 scripts/integrate_coding_workspace.py

      - name: Apply compile repairs
        run: python3 scripts/fix_coding_workspace_compile.py

      - name: Integrate parallel sub-agents
        run: python3 scripts/integrate_parallel_subagents.py

      - name: Repair generated test fixtures and loopback guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          coding_path = Path("src-tauri/src/coding_control.rs")
          coding = coding_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "INSERT INTO conversations (id, title, mode, created_at, updated_at) VALUES (?1, 'test', 'chat', ?2, ?2)",
                  "INSERT INTO conversations (id, title, created_at, updated_at) VALUES (?1, 'test', ?2, ?2)",
              ),
              (
                  "INSERT INTO model_registry (id, name, path, format, quantization, capabilities_json, min_ram_bytes, min_vram_bytes, enabled, created_at, updated_at)\n             VALUES (?1, 'test', 'test.gguf', 'gguf', 'Q4', '[]', 0, NULL, 1, ?2, ?2)",
                  "INSERT INTO model_registry (id, name, path, format, quantization, enabled, created_at, updated_at)\n             VALUES (?1, 'test', 'test.gguf', 'gguf', 'Q4', 1, ?2, ?2)",
              ),
              (
                  "VALUES (?1, ?2, 'assistant', '', 'complete', ?3, ?4, ?4)",
                  "VALUES (?1, ?2, 'assistant', '', 'completed', ?3, ?4, ?4)",
              ),
          ]
          for old, new in replacements:
              if old not in coding:
                  raise SystemExit(f"coding_control repair anchor missing: {old[:100]!r}")
              coding = coding.replace(old, new, 1)
          coding_path.write_text(coding, encoding="utf-8")

          parallel_path = Path("src-tauri/src/openagent_parallel.rs")
          parallel = parallel_path.read_text(encoding="utf-8")
          old_import = "use std::{\n    sync::Arc,\n    time::{Duration, Instant},\n};"
          new_import = "use std::{\n    net::IpAddr,\n    sync::Arc,\n    time::{Duration, Instant},\n};"
          if old_import not in parallel:
              raise SystemExit("openagent_parallel import repair anchor missing")
          parallel = parallel.replace(old_import, new_import, 1)
          old_guard = '''    let host = url
        .host_str()
        .ok_or_else(|| AppError::internal("local model endpoint has no host"))?;
    if !matches!(host, "127.0.0.1" | "localhost" | "::1") {
        return Err(AppError::internal(
            "parallel sub-agents refuse non-loopback model endpoints",
        ));
    }
'''
          new_guard = '''    let host = url
        .host_str()
        .ok_or_else(|| AppError::internal("local model endpoint has no host"))?;
    let normalized_host = host.trim_matches(|character| character == '[' || character == ']');
    let is_loopback = normalized_host.eq_ignore_ascii_case("localhost")
        || normalized_host
            .parse::<IpAddr>()
            .is_ok_and(|address| address.is_loopback());
    if !is_loopback {
        return Err(AppError::internal(
            "parallel sub-agents refuse non-loopback model endpoints",
        ));
    }
'''
          if old_guard not in parallel:
              raise SystemExit("openagent_parallel loopback repair anchor missing")
          parallel = parallel.replace(old_guard, new_guard, 1)
          parallel_path.write_text(parallel, encoding="utf-8")
          PY

      - name: Remove one-shot files
        run: |
          rm -f scripts/normalize_coding_bootstrap.py
          rm -f scripts/normalize_parallel_bootstrap.py
          rm -f scripts/integrate_coding_workspace.py
          rm -f scripts/fix_coding_workspace_compile.py
          rm -f scripts/integrate_parallel_subagents.py
          rm -f .github/workflows/coding-workspace-validation.yml
          rm -f .github/workflows/coding-workspace-repair.yml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf bubblewrap

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | tee clippy-output.txt

      - name: Persist Clippy diagnostics
        if: failure() && steps.clippy.outcome == 'failure'
        run: |
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f clippy-output.txt
          git commit -m "ci: capture clippy failure"
          git push origin HEAD:work/openagent-parallel-repair

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Deterministic coding evaluation
        run: python3 scripts/coding_workspace_eval.py

      - name: Adversarial security evaluation
        run: python3 scripts/coding_security_suite.py

      - name: Diff safety
        run: git diff --check

      - name: Commit verified coding workspace
        run: |
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate parallel OpenAgent sub-agents"
          git push origin HEAD:work/openagent-parallel-repair
