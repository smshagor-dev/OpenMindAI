name: Install PDF parser dependency

on:
  push:
    branches:
      - production-readiness-completion
    paths:
      - .github/workflows/install-pdf-parser.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: production-readiness-completion

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Add PDF.js
        run: npm install --save-exact pdfjs-dist@6.2.108

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add local PDF text extraction dependency"
          git push origin HEAD:production-readiness-completion
