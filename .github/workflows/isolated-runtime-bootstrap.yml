name: Isolated Runtime Integration

on:
  push:
    branches:
      - work/isolated-runtime

permissions:
  contents: write

concurrency:
  group: isolated-runtime-bootstrap
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Harden isolated runtime implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src-tauri/src/isolated_runtime.rs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'use serde::{Deserialize, Serialize};\n',
                  'use serde::Serialize;\n#[cfg(target_os = "windows")]\nuse serde::Deserialize;\n',
                  'serde import',
              ),
              (
                  'const SAFE_PATH: &str = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin";\n',
                  '#[cfg(any(target_os = "linux", target_os = "macos"))]\nconst SAFE_PATH: &str = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin";\n',
                  'SAFE_PATH',
              ),
              (
                  'fn trusted_executable(candidates: &[&str]) -> Option<PathBuf> {\n',
                  '#[cfg(any(target_os = "linux", target_os = "macos"))]\nfn trusted_executable(candidates: &[&str]) -> Option<PathBuf> {\n',
                  'trusted_executable cfg',
              ),
              (
                  'fn shell_wrapper(command: &str) -> String {\n',
                  '#[cfg(not(target_os = "windows"))]\nfn shell_wrapper(command: &str) -> String {\n',
                  'shell_wrapper cfg',
              ),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'{label} target not found exactly once')
              text = text.replace(old, new, 1)

          call_pattern = re.compile(
              r'(?m)^    finish_isolated_output\(\n(?P<body>(?:        .*\n)+?)^    \)'
          )
          matches = list(call_pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'expected 2 finish_isolated_output calls, found {len(matches)}')

          def call_replacement(match):
              body = match.group('body')
              if '"bubblewrap"' in body:
                  backend = 'bubblewrap'
                  prefix = 'Some("/workspace")'
              elif '"sandbox-exec"' in body:
                  backend = 'sandbox-exec'
                  prefix = 'None'
              else:
                  raise SystemExit('unexpected isolated output backend')
              return f'''    finish_isolated_output(IsolatedOutput {{
                  workspace_root,
                  cwd,
                  exit_code: output.status.code().unwrap_or(-1),
                  stdout: &output.stdout,
                  stderr: &output.stderr,
                  started,
                  max_output_chars,
                  backend: "{backend}",
                  sandbox_workspace_prefix: {prefix},
              }})'''

          text = call_pattern.sub(call_replacement, text)

          helper_pattern = re.compile(
              r'(?m)^fn finish_isolated_output\(\n(?P<params>(?:    .*\n)+?)^\) -> Result<ShellExecutionResult, AppError> \{\n'
          )
          helper_matches = list(helper_pattern.finditer(text))
          if len(helper_matches) != 1:
              raise SystemExit(f'expected one finish helper, found {len(helper_matches)}')
          expected_fields = [
              'workspace_root: &Path', 'cwd: &Path', 'exit_code: i32', 'stdout: &[u8]',
              'stderr: &[u8]', 'started: Instant', 'max_output_chars: usize',
              'backend: &str', 'sandbox_workspace_prefix: Option<&str>',
          ]
          params = helper_matches[0].group('params')
          if not all(field in params for field in expected_fields):
              raise SystemExit('finish helper parameters changed unexpectedly')

          helper = '''#[cfg(any(target_os = "linux", target_os = "macos"))]
          struct IsolatedOutput<'a> {
              workspace_root: &'a Path,
              cwd: &'a Path,
              exit_code: i32,
              stdout: &'a [u8],
              stderr: &'a [u8],
              started: Instant,
              max_output_chars: usize,
              backend: &'a str,
              sandbox_workspace_prefix: Option<&'a str>,
          }

          #[cfg(any(target_os = "linux", target_os = "macos"))]
          fn finish_isolated_output(output: IsolatedOutput<'_>) -> Result<ShellExecutionResult, AppError> {
              let IsolatedOutput {
                  workspace_root,
                  cwd,
                  exit_code,
                  stdout,
                  stderr,
                  started,
                  max_output_chars,
                  backend,
                  sandbox_workspace_prefix,
              } = output;
          '''
          text = helper_pattern.sub(helper, text, count=1)

          for fn_name in ['translate_sandbox_cwd', 'canonical_scoped_marker']:
              pattern = re.compile(rf'(?m)^fn {fn_name}\b')
              text, count = pattern.subn(
                  f'#[cfg(any(target_os = "linux", target_os = "macos"))]\nfn {fn_name}',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'{fn_name} target not found exactly once')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply isolated runtime integration
        run: python scripts/bootstrap_isolated_runtime.py

      - name: Remove one-shot integration files
        run: |
          rm scripts/bootstrap_isolated_runtime.py
          rm .github/workflows/isolated-runtime-bootstrap.yml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf bubblewrap

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Commit verified integration
        run: |
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add fail-closed isolated command runtime"
          git push origin HEAD:work/isolated-runtime
