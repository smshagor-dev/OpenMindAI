name: Refresh Cargo Lock

on:
  push:
    paths:
      - .github/lock-refresh.trigger

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve missing locked dependencies
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "build(rust): refresh locked native dependencies"
          git push origin HEAD
