name: Project Workspace Patch

on:
  push:
    branches:
      - projects-workspace-polish
    paths:
      - .github/workflows/projects-workspace-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: projects-workspace-polish
      - name: Apply project wiring and remove helper
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src-tauri/src/database.rs",
              '''    Migration {
                  number: 5,
                  name: "005_artifact_cleanup_and_media_kinds",
                  sql: include_str!("../migrations/005_artifact_cleanup_and_media_kinds.sql"),
              },
          ];''',
              '''    Migration {
                  number: 5,
                  name: "005_artifact_cleanup_and_media_kinds",
                  sql: include_str!("../migrations/005_artifact_cleanup_and_media_kinds.sql"),
              },
              Migration {
                  number: 6,
                  name: "006_single_project_per_conversation",
                  sql: include_str!("../migrations/006_single_project_per_conversation.sql"),
              },
          ];''',
          )

          replace_once(
              "src-tauri/src/portable_root.rs",
              'pub const CURRENT_SCHEMA_VERSION: u32 = 5;',
              'pub const CURRENT_SCHEMA_VERSION: u32 = 6;',
          )

          replace_once(
              "src/App.tsx",
              '''  async function createProjectConversation(project: Project) {
              const title = `${project.name}: New chat`;
              const conversation = await api.createConversation(title);
              setConversations((items) => [conversation, ...items]);
              setActiveId(conversation.id);
              setEditingMessageId(null);
              setView("chat");
              setMessages([]);
              await refreshApp();
              window.setTimeout(() => composerRef.current?.focus(), 0);
              return conversation;
            }''',
              '''  async function createProjectConversation(project: Project) {
              const title = `${project.name}: New chat`;
              const conversation = await api.createConversation(title);
              setConversations((items) => [conversation, ...items]);
              return conversation;
            }''',
          )

          replace_once(
              "src-tauri/src/lib_legacy.rs",
              '''fn update_project(
              project_id: String,
              name: String,
              instructions: String,
              state: State<AppState>,
          ) -> Result<Project, app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              ProjectRepository::new(&db).update_project(&project_id, &name, &instructions)
          }''',
              '''fn update_project(
              project_id: String,
              name: String,
              instructions: String,
              state: State<AppState>,
          ) -> Result<Project, app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              let project = ProjectRepository::new(&db).update_project(&project_id, &name, &instructions)?;
              sync_project_context_for_project(&db, &project)?;
              Ok(project)
          }''',
          )

          replace_once(
              "src-tauri/src/lib_legacy.rs",
              '''fn delete_project(project_id: String, state: State<AppState>) -> Result<(), app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              ProjectRepository::new(&db).delete_project(&project_id)
          }''',
              '''fn delete_project(project_id: String, state: State<AppState>) -> Result<(), app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              let repo = ProjectRepository::new(&db);
              let project = repo.find_project(&project_id)?;
              repo.delete_project(&project_id)?;
              let chats = ChatRepository::new(&db);
              for conversation_id in project.conversation_ids {
                  chats.upsert_profile_context(&conversation_id, None)?;
              }
              Ok(())
          }''',
          )

          replace_once(
              "src-tauri/src/lib_legacy.rs",
              '''fn link_project_conversation(
              project_id: String,
              conversation_id: String,
              state: State<AppState>,
          ) -> Result<(), app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              ProjectRepository::new(&db).link_conversation(&project_id, &conversation_id)
          }''',
              '''fn link_project_conversation(
              project_id: String,
              conversation_id: String,
              state: State<AppState>,
          ) -> Result<(), app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              ProjectRepository::new(&db).link_conversation(&project_id, &conversation_id)?;
              sync_project_context_in_database(&db, &conversation_id)
          }''',
          )

          replace_once(
              "src-tauri/src/lib_legacy.rs",
              '''fn unlink_project_conversation(
              project_id: String,
              conversation_id: String,
              state: State<AppState>,
          ) -> Result<(), app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              ProjectRepository::new(&db).unlink_conversation(&project_id, &conversation_id)
          }''',
              '''fn unlink_project_conversation(
              project_id: String,
              conversation_id: String,
              state: State<AppState>,
          ) -> Result<(), app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              ProjectRepository::new(&db).unlink_conversation(&project_id, &conversation_id)?;
              ChatRepository::new(&db).upsert_profile_context(&conversation_id, None)
          }''',
          )

          replace_once(
              "src-tauri/src/lib_legacy.rs",
              '''fn add_project_file(
              input: ProjectFileInput,
              state: State<AppState>,
          ) -> Result<ProjectFile, app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              ProjectRepository::new(&db).add_file(&input)
          }''',
              '''fn add_project_file(
              input: ProjectFileInput,
              state: State<AppState>,
          ) -> Result<ProjectFile, app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              let repo = ProjectRepository::new(&db);
              let file = repo.add_file(&input)?;
              let project = repo.find_project(&input.project_id)?;
              sync_project_context_for_project(&db, &project)?;
              Ok(file)
          }''',
          )

          replace_once(
              "src-tauri/src/lib_legacy.rs",
              '''fn delete_project_file(
              project_id: String,
              file_id: String,
              state: State<AppState>,
          ) -> Result<(), app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              ProjectRepository::new(&db).delete_file(&project_id, &file_id)
          }''',
              '''fn delete_project_file(
              project_id: String,
              file_id: String,
              state: State<AppState>,
          ) -> Result<(), app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              let repo = ProjectRepository::new(&db);
              repo.delete_file(&project_id, &file_id)?;
              let project = repo.find_project(&project_id)?;
              sync_project_context_for_project(&db, &project)
          }''',
          )

          replace_once(
              "src-tauri/src/lib_legacy.rs",
              '''    let model = routing.model;

              let (user, assistant) = {''',
              '''    let model = routing.model;
              sync_project_context(&state, &conversation_id)?;

              let (user, assistant) = {''',
          )
          replace_once(
              "src-tauri/src/lib_legacy.rs",
              '''        (user, assistant)
              };
              sync_project_context(&state, &conversation_id)?;
              app.emit(''',
              '''        (user, assistant)
              };
              app.emit(''',
          )

          replace_once(
              "src-tauri/src/lib_legacy.rs",
              '''fn sync_project_context(
              state: &State<'_, AppState>,
              conversation_id: &str,
          ) -> Result<(), app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              let project = ProjectRepository::new(&db).project_for_conversation(conversation_id)?;
              let content = project.as_ref().and_then(project_context_message);
              ChatRepository::new(&db).upsert_profile_context(conversation_id, content.as_deref())
          }''',
              '''fn sync_project_context_in_database(
              db: &Database,
              conversation_id: &str,
          ) -> Result<(), app_error::AppError> {
              let project = ProjectRepository::new(db).project_for_conversation(conversation_id)?;
              let content = project.as_ref().and_then(project_context_message);
              ChatRepository::new(db).upsert_profile_context(conversation_id, content.as_deref())
          }

          fn sync_project_context_for_project(
              db: &Database,
              project: &Project,
          ) -> Result<(), app_error::AppError> {
              let content = project_context_message(project);
              let chats = ChatRepository::new(db);
              for conversation_id in &project.conversation_ids {
                  chats.upsert_profile_context(conversation_id, content.as_deref())?;
              }
              Ok(())
          }

          fn sync_project_context(
              state: &State<'_, AppState>,
              conversation_id: &str,
          ) -> Result<(), app_error::AppError> {
              let db = state
                  .database
                  .lock()
                  .map_err(|_| app_error::AppError::internal("database lock poisoned"))?;
              sync_project_context_in_database(&db, conversation_id)
          }''',
          )

          Path(".github/workflows/projects-workspace-patch.yml").unlink()
      - name: Commit patched project workspace
        shell: bash
        run: |
          git config user.name openmindai-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "fix(projects): wire durable project context and migration"
          git push origin HEAD:projects-workspace-polish
