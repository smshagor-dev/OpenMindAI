name: Token Latency Fix

on:
  push:
    branches:
      - fix/resolve-token-generation-slow

permissions:
  contents: write

concurrency:
  group: token-latency-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/resolve-token-generation-slow
          fetch-depth: 0

      - name: Apply P0-P3 performance patch
        run: |
          sed -i 's/    2,$/    1,/' scripts/apply_token_latency_fix.py
          python3 scripts/apply_token_latency_fix.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/App.tsx")
          text = path.read_text(encoding="utf-8")
          old = """        await refreshMessages(conversationId, setMessages, showError);\n        await refreshApp();\n"""
          new = """        await refreshMessages(conversationId, setMessages, showError);\n        setConversations(await api.conversations());\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one Work refresh match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("src-tauri/src/lib_legacy.rs")
          text = path.read_text(encoding="utf-8")
          marker = '    let normalized_mode = mode.to_ascii_lowercase();\n\n    if normalized_mode == "vision" {'
          marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit("model routing marker not found")
          parameter = "    content: &str,"
          parameter_index = text.rfind(parameter, 0, marker_index)
          if parameter_index < 0 or marker_index - parameter_index > 2_000:
              raise SystemExit("model routing content parameter not found near routing marker")
          text = text[:parameter_index] + "    _content: &str," + text[parameter_index + len(parameter):]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Refresh Rust lockfile
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-features

      - name: Format Rust changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features

      - name: Remove temporary patch automation
        run: |
          rm scripts/apply_token_latency_fix.py
          rm .github/workflows/token-latency-fix.yml
          rm -f .github/latency-fix-trigger

      - name: Commit validated performance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve local token generation latency"
          git push origin HEAD:fix/resolve-token-generation-slow
