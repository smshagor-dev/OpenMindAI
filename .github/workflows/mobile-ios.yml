name: iOS Simulator Validation

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: iOS aarch64 simulator build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Verify Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Verify Rust dependency lock
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate shared frontend
        run: npm run build

      - name: Initialize iOS target
        env:
          CI: "true"
        run: npm run ios:init -- --ci --skip-targets-install

      - name: Build iOS aarch64 simulator app
        env:
          CI: "true"
        run: npm run ios:build -- --debug --target aarch64-sim --ci

      - name: Resolve simulator app
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated iOS outputs:"
          find src-tauri/gen -maxdepth 12 \( -type d -name "*.app" -o -type f -name "*.ipa" \) -print 2>/dev/null || true
          app_path="$(find src-tauri/gen -type d -name "*.app" | sort | head -n 1)"
          test -n "${app_path}"
          test -d "${app_path}"
          echo "IOS_SIM_APP=${app_path}" >> "${GITHUB_ENV}"
          echo "Using simulator app: ${app_path}"

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: openmindai-ios-aarch64-simulator
          path: ${{ env.IOS_SIM_APP }}
          if-no-files-found: error
          retention-days: 14
