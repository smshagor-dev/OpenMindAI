name: Native lock resolve

on:
  push:
    branches:
      - feature/cxx-llama-native-bridge

permissions:
  contents: write

jobs:
  resolve-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cxx-llama-native-bridge
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve only newly required lock entries
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "build(native): add cxx dependencies to Cargo.lock"
          git push origin HEAD:feature/cxx-llama-native-bridge
