name: ZIP 9 Upstream Compatibility

on:
  pull_request:
    paths:
      - scripts/probe-zip9-upgrade.py
      - scripts/zip9-reader-regressions.rs
      - .github/workflows/zip9-upstream-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ZIP 9-patched TTS and checkpoint readers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache compiled Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify probe source transformation
        run: python scripts/probe-zip9-upgrade.py --self-test

      - name: Install RustSec audit tool
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run unignored RustSec audit and ZIP 9 compatibility (Linux)
        if: runner.os == 'Linux'
        env:
          ZIP9_EVIDENCE_DIR: ${{ runner.temp }}/zip9-source-evidence
        run: python scripts/probe-zip9-upgrade.py --audit

      - name: Test ephemeral upstream ZIP 9 compatibility (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          ZIP9_EVIDENCE_DIR: ${{ runner.temp }}/zip9-source-evidence
        run: python scripts/probe-zip9-upgrade.py

      - name: Upload ZIP 9 candidate source provenance and exact patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zip9-source-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/zip9-source-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify no tracked build input changed
        if: always()
        run: git diff --exit-code -- src-tauri/Cargo.toml src-tauri/Cargo.lock
