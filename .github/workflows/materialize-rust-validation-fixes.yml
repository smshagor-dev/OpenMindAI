name: Materialize Rust validation fixes

on:
  push:
    branches:
      - rust-cross-platform-validation-fix
    paths:
      - .github/workflows/materialize-rust-validation-fixes.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout focused fix branch
        uses: actions/checkout@v4
        with:
          ref: rust-cross-platform-validation-fix

      - name: Apply validated Rust cleanup set
        run: python scripts/apply_rust_validation_fixes.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Format frontend wire-contract change
        run: npx prettier --write src/api.ts

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit deterministic validation fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api.ts src-tauri/src/document_generator.rs src-tauri/src/hardware.rs src-tauri/src/runtime.rs src-tauri/src/lib.rs src-tauri/src/model_catalog.rs src-tauri/src/model_package.rs src-tauri/src/projects.rs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Fix cross-platform Rust validation"
          git push origin HEAD:rust-cross-platform-validation-fix
