name: Apply diffusion runtime hardening

on:
  push:
    branches:
      - runtime-hardening-video-voice
    paths:
      - scripts/apply_runtime_hardening.py
      - .github/workflows/apply-runtime-hardening.yml

permissions:
  contents: write

concurrency:
  group: runtime-hardening-video-voice
  cancel-in-progress: true

jobs:
  harden-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: runtime-hardening-video-voice

      - name: Fix legacy manifest test fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_runtime_hardening.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '"source_url"': '"sourceUrl"',
              '"archive_sha256"': '"archiveSha256"',
              '"cli_path"': '"cliPath"',
              '"installed_at"': '"installedAt"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"legacy fixture field not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply production hardening
        run: python scripts/apply_runtime_hardening.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf cmake build-essential pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Remove branch-only workflow
        run: rm -f .github/workflows/apply-runtime-hardening.yml

      - name: Diff hygiene
        run: git diff --check

      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Harden pinned diffusion runtime installation"
          git push origin HEAD:runtime-hardening-video-voice
