name: Format Mobile Runtime PR

on:
  push:
    branches:
      - fix/mobile-embedded-runtime-model-flow

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/mobile-embedded-runtime-model-flow
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm .github/workflows/format-mobile-runtime-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src .github/workflows/format-mobile-runtime-pr.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git commit -m "style: format mobile runtime changes"
          git push origin HEAD:fix/mobile-embedded-runtime-model-flow
