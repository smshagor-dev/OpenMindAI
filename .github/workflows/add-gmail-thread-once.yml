name: Add Gmail thread action once

on:
  push:
    branches:
      - connected-agent-e2e-stabilization

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: connected-agent-e2e-stabilization

      - name: Add Gmail thread read action
        shell: python
        run: |
          from pathlib import Path

          backend = Path('src-tauri/src/google_workspace.rs')
          text = backend.read_text(encoding='utf-8')
          needle = '''        "gmail.get" => {\n            let id = required_str(&params, "messageId")?;\n            let url =\n                format!("https://gmail.googleapis.com/gmail/v1/users/me/messages/{id}?format=full");\n            google_request(&state, Method::GET, &url, None).await\n        }\n'''
          addition = needle + '''        "gmail.thread" => {\n            let id = required_str(&params, "threadId")?;\n            let url =\n                format!("https://gmail.googleapis.com/gmail/v1/users/me/threads/{id}?format=full");\n            google_request(&state, Method::GET, &url, None).await\n        }\n'''
          if '"gmail.thread" =>' not in text:
              if needle not in text:
                  raise SystemExit('Gmail message handler anchor not found')
              backend.write_text(text.replace(needle, addition, 1), encoding='utf-8')

          frontend = Path('src/lib/connectedActions.ts')
          text = frontend.read_text(encoding='utf-8')
          needle = '  google("gmail.get", "Gmail · Read message", "Read a Gmail message including headers and body payload.", false, { messageId: "MESSAGE_ID" }),\n'
          addition = needle + '  google("gmail.thread", "Gmail · Read thread", "Read a Gmail conversation thread with its messages.", false, { threadId: "THREAD_ID" }),\n'
          if 'google("gmail.thread"' not in text:
              if needle not in text:
                  raise SystemExit('Gmail frontend action anchor not found')
              frontend.write_text(text.replace(needle, addition, 1), encoding='utf-8')

      - name: Format, remove helper, and commit
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git rm .github/workflows/add-gmail-thread-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/google_workspace.rs src/lib/connectedActions.ts
          git commit -m "feat(connectors): add Gmail thread read action"
          git push origin HEAD:connected-agent-e2e-stabilization
