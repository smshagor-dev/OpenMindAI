name: Wire vision runtime

on:
  push:
    branches:
      - production-readiness-completion
    paths:
      - .github/workflows/wire-vision-runtime.yml
      - scripts/wire_vision_runtime.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: production-readiness-completion

      - name: Apply runtime patch
        run: python scripts/wire_vision_runtime.py

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/runtime.rs src-tauri/src/model_registry.rs src-tauri/src/model_download.rs src-tauri/src/model_package.rs src-tauri/src/model_catalog.rs
          git commit -m "Wire multimodal projector runtime"
          git push origin HEAD:production-readiness-completion
