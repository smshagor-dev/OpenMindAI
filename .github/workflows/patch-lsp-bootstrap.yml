name: Patch and Symbol Integration

on:
  push:
    branches:
      - work/patch-lsp-core

permissions:
  contents: write

concurrency:
  group: patch-lsp-bootstrap
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bring proven patch and symbol cores into the clean branch
        run: |
          git fetch origin 12a43a841248f7ceec3f4be8036cc10c9df1f74c --depth=1
          git show 12a43a841248f7ceec3f4be8036cc10c9df1f74c:src-tauri/src/openagent_patch.rs > src-tauri/src/coding_patch.rs
          git show 12a43a841248f7ceec3f4be8036cc10c9df1f74c:src-tauri/src/openagent_lsp.rs > src-tauri/src/coding_lsp.rs

      - name: Align bootstrap with current tree
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/bootstrap_patch_lsp.py')
          s = p.read_text(encoding='utf-8')
          old = '    "mod chat;\\n",\n    "mod chat;\\nmod coding_lsp;\\nmod coding_patch;\\n",'
          new = '    "mod github_workspace;\\n",\n    "mod coding_lsp;\\nmod coding_patch;\\nmod github_workspace;\\n",'
          if s.count(old) != 1:
              raise SystemExit('current module bootstrap anchor not found exactly once')
          s = s.replace(old, new, 1)
          replacements = [
              (
                  'if allow_language_server && let Some(spec) = select_server(&root, None)',
                  'if let (true, Some(spec)) = (allow_language_server, select_server(&root, None))',
              ),
              (
                  'if allow_language_server && let Some(spec) = select_server(&root, Some(&file))',
                  'if let (true, Some(spec)) = (allow_language_server, select_server(&root, Some(&file)))',
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'compatibility bootstrap target not found exactly once: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply integration and security hardening
        run: |
          python scripts/bootstrap_patch_lsp.py
          python - <<'PY'
          from pathlib import Path

          security_path = Path('src-tauri/src/openagent_security.rs')
          security = security_path.read_text(encoding='utf-8')
          old = '            RiskLevel::WorkspaceWrite\n        }\n'
          new = '            RiskLevel::WorkspaceWrite\n        },\n'
          if old not in security:
              raise SystemExit('workspace-write match arm not found')
          security_path.write_text(security.replace(old, new, 1), encoding='utf-8')

          local_path = Path('src-tauri/src/local_agent.rs')
          local = local_path.read_text(encoding='utf-8')
          fixes = [
              ('operations\\\":[{\\\"op\\\":\\\"replace\\\"', 'operations\\\":[{{\\\"op\\\":\\\"replace\\\"'),
              ('\\\"replacement\\\"},{\\\"op\\\":\\\"create\\\"', '\\\"replacement\\\"}},{{\\\"op\\\":\\\"create\\\"'),
              ('\\\"complete content\\\"}]}}', '\\\"complete content\\\"}}]}}'),
          ]
          for old, new in fixes:
              if local.count(old) != 1:
                  raise SystemExit(f'patch schema escape target not found exactly once: {old}')
              local = local.replace(old, new, 1)
          local_path.write_text(local, encoding='utf-8')

          lsp_path = Path('src-tauri/src/coding_lsp.rs')
          lsp = lsp_path.read_text(encoding='utf-8')
          old = "rest.trim_start_matches(|c: char| c == '*' || c == '&' || c == '(')"
          new = "rest.trim_start_matches(|c: char| ['*', '&', '('].contains(&c))"
          if lsp.count(old) != 1:
              raise SystemExit('symbol declaration trim target not found exactly once')
          lsp_path.write_text(lsp.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-shot files
        run: |
          rm scripts/bootstrap_patch_lsp.py
          rm .github/workflows/patch-lsp-bootstrap.yml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit verified integration
        run: |
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add atomic patching and symbol navigation"
          git push origin HEAD:work/patch-lsp-core
