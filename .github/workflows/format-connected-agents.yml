name: Format connected agents

on:
  push:
    branches:
      - connected-agent-e2e-stabilization

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[connector-fmt]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: connected-agent-e2e-stabilization

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format connector sources
        run: |
          rustfmt --edition 2021 src-tauri/src/connector_stabilization.rs
          rustfmt --edition 2021 src-tauri/src/google_workspace.rs
          rustfmt --edition 2021 src-tauri/src/github_workspace.rs

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Connector sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/connector_stabilization.rs src-tauri/src/google_workspace.rs src-tauri/src/github_workspace.rs
          git commit -m "style(connectors): apply rustfmt [connector-fmt]"
          git push origin HEAD:connected-agent-e2e-stabilization
