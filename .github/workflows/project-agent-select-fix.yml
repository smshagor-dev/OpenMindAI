name: Project Agent Select Fix

on:
  push:
    branches:
      - feature/project-agent-production-hardening

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/project-agent-production-hardening

      - name: Patch tokio select branch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/local_agent.rs")
          text = path.read_text()
          old = "                step,\n            ).await => result?,\n"
          new = "                step,\n            ) => result?,\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one anchor, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit source fix and remove helper
        shell: bash
        run: |
          git config user.name openmindai-ci
          git config user.email actions@users.noreply.github.com
          git add src-tauri/src/local_agent.rs
          git rm .github/workflows/project-agent-select-fix.yml
          git diff --cached --check
          git commit -m "fix(agent): await model request through tokio select"
          git push origin HEAD:feature/project-agent-production-hardening
