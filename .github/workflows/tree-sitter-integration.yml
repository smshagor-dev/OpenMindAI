name: OpenAgent Tree-sitter Integration

on:
  push:
    branches:
      - work/openagent-tree-sitter-fallback

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf bubblewrap

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Resolve Tree-sitter dependencies
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust check locked
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Deterministic coding evaluation
        run: python3 scripts/coding_workspace_eval.py

      - name: Adversarial security evaluation
        run: python3 scripts/coding_security_suite.py

      - name: Diff safety
        run: git diff --check

      - name: Finalize verified integration
        run: |
          rm -f .github/workflows/tree-sitter-integration.yml
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add Tree-sitter AST-aware fallback"
          git push origin HEAD:work/openagent-tree-sitter-fallback