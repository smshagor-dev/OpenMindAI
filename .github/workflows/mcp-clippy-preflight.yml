name: MCP Clippy Preflight

on:
  push:
    branches:
      - fix-mcp-sse-clippy
    paths:
      - .github/workflows/mcp-clippy-preflight.yml

permissions:
  contents: write

jobs:
  clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-mcp-sse-clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Remove preflight workflow
        if: always()
        shell: bash
        run: |
          rm .github/workflows/mcp-clippy-preflight.yml
          git config user.name openmindai-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove MCP Clippy preflight"
          git push origin HEAD:fix-mcp-sse-clippy
