name: Apply video and voice runtime

on:
  push:
    branches:
      - end-to-end-video-voice-runtime
    paths:
      - scripts/apply_video_voice_runtime.py
      - scripts/fix_video_voice_clippy.py
      - .github/workflows/apply-video-voice-runtime.yml

permissions:
  contents: write

concurrency:
  group: apply-video-voice-runtime
  cancel-in-progress: true

jobs:
  materialize-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: end-to-end-video-voice-runtime

      - name: Clear previous compiler diagnostic
        run: rm -f clippy-summary.txt rust-test-summary.txt

      - name: Materialize production source
        run: python scripts/apply_video_voice_runtime.py

      - name: Apply strict Clippy refactor
        run: python scripts/fix_video_voice_clippy.py

      - name: Fix Candle model path conversion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/voice_runtime.rs")
          text = path.read_text(encoding="utf-8")
          old = '        let config = TtsConfig::new(ModelType::Kokoro).with_model_path(&package_dir);'
          new = '''        let config = TtsConfig::new(ModelType::Kokoro)
              .with_model_path(package_dir.to_string_lossy().into_owned());'''
          if old not in text:
              raise SystemExit("Candle model path anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend format
        run: npx prettier --write src/App.tsx src/lib/chat.ts

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf cmake build-essential pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Strict Clippy
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "Strict Clippy failed with exit code $status"
              echo
              tail -n 300 clippy.log
            } > clippy-summary.txt
          fi
          exit "$status"

      - name: Persist Clippy diagnostic
        if: failure() && steps.clippy.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clippy-summary.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record video voice Clippy diagnostic"
          git push origin HEAD:end-to-end-video-voice-runtime

      - name: Rust tests
        id: rust_tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --all-features 2>&1 | tee rust-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "Rust tests failed with exit code $status"
              echo
              tail -n 500 rust-tests.log
            } > rust-test-summary.txt
          fi
          exit "$status"

      - name: Persist Rust test diagnostic
        if: failure() && steps.rust_tests.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-test-summary.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record video voice Rust test diagnostic"
          git push origin HEAD:end-to-end-video-voice-runtime

      - name: Diff hygiene
        run: git diff --check

      - name: Commit validated production implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Implement end-to-end video and voice generation"
          git push origin HEAD:end-to-end-video-voice-runtime
