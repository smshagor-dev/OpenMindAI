name: V3 README Release State

on:
  push:
    branches:
      - "release/v3.0.0-readiness"
    paths:
      - ".github/workflows/v3-readme-release-state.yml"

permissions:
  contents: write

jobs:
  correct-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release/v3.0.0-readiness
          fetch-depth: 0

      - name: Correct README release state
        run: python3 scripts/fix-v3-readme.py

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-version-consistency.mjs --tag v3.0.0
          node scripts/check-release-readiness.mjs
          git diff --check
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v3-readme-release-state.yml scripts/fix-v3-readme.py
          git add README.md
          git commit -m "docs(release): mark v3.0.0 as release candidate"
          git push origin HEAD:release/v3.0.0-readiness
