name: Connector Type Fix

on:
  push:
    branches:
      - connector-ecosystem-stabilization

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: connector-ecosystem-stabilization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix MCP response type
        shell: python
        run: |
          from pathlib import Path
          path = Path('src-tauri/src/connector_ecosystem.rs')
          text = path.read_text()
          old = '    let value = if content_type.contains("text/event-stream") {'
          new = '    let value: Value = if content_type.contains("text/event-stream") {'
          assert text.count(old) == 1, 'MCP response value pattern not uniquely found'
          path.write_text(text.replace(old, new, 1))
      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/connector-type-fix.yml
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(connectors): type MCP JSON-RPC response"
          git push origin HEAD:connector-ecosystem-stabilization
