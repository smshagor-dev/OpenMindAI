name: Context path normalization validation

on:
  push:
    branches: [work/context-selection-compression]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Normalize repository context paths
        shell: python
        run: |
          from pathlib import Path
          path = Path('src-tauri/src/openagent_context.rs')
          text = path.read_text(encoding='utf-8')
          old = '''fn normalized_relative(root: &Path, path: &Path) -> String {
              relative_display(root, path).replace('\\\\', "/")
          }

          fn relative_display(root: &Path, path: &Path) -> String {
              path.strip_prefix(root)
                  .unwrap_or(path)
                  .display()
                  .to_string()
          }
          '''.replace('          ', '')
          new = '''fn normalized_relative(root: &Path, path: &Path) -> String {
              relative_display(root, path)
          }

          fn relative_display(root: &Path, path: &Path) -> String {
              path.strip_prefix(root)
                  .unwrap_or(path)
                  .display()
                  .to_string()
                  .replace('\\\\', "/")
          }
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('portable path normalization anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Context tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml openagent_context -- --nocapture
      - name: Diff check
        run: git diff --check
      - name: Remove temporary validation workflow
        run: rm .github/workflows/context-path-normalization-fix.yml
      - name: Commit portable path fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/openagent_context.rs .github/workflows/context-path-normalization-fix.yml
          git commit -m 'fix: normalize repository context paths across platforms'
          git push origin HEAD:work/context-selection-compression
