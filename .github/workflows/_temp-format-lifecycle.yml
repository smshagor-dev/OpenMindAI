name: Temporary Lifecycle Rustfmt

on:
  pull_request:
    paths:
      - "src-tauri/src/mobile_inference.rs"
      - ".github/workflows/_temp-format-lifecycle.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lifecycle branch
        uses: actions/checkout@v7
        with:
          ref: perf/android-lifecycle-main
          fetch-depth: 0

      - name: Setup Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/mobile_inference.rs
          git commit -m "style(rust): apply lifecycle rustfmt"
          git push origin HEAD:perf/android-lifecycle-main
