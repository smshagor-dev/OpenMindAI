name: JS YAML Audit Fix

on:
  push:
    branches:
      - fix/js-yaml-audit

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/js-yaml-audit
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Update vulnerable lockfile entry
        run: npm audit fix --package-lock-only

      - name: Verify lockfile install
        run: npm ci

      - name: Verify high-severity audit
        run: npm audit --audit-level=high

      - name: Ensure focused lockfile change
        run: |
          git diff --check
          git diff -- package.json
          test -z "$(git status --short package.json)"

      - name: Remove one-shot workflow
        run: rm .github/workflows/js-yaml-audit-fix.yml

      - name: Commit security fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/js-yaml-audit-fix.yml
          git diff --cached --check
          git commit -m "fix: update js-yaml security lockfile"
          git push origin HEAD:fix/js-yaml-audit
