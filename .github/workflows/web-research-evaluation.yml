name: Web Research Evaluation
on:
  pull_request:
    paths:
      - 'scripts/evaluate-web-research.py'
      - 'tests/test_web_research_evaluation.py'
      - 'tests/fixtures/web-research-evaluation.json'
      - '.github/workflows/web-research-evaluation.yml'
  workflow_dispatch:
jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p test_web_research_evaluation.py -v
      - name: Evaluate deterministic fixture
        run: python scripts/evaluate-web-research.py tests/fixtures/web-research-evaluation.json --output web-research-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-research-evaluation
          path: web-research-report.json
