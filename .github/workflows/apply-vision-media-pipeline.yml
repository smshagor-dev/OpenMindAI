name: Apply vision media pipeline

on:
  push:
    branches:
      - production-readiness-completion
    paths:
      - scripts/apply_vision_media_pipeline.py
      - scripts/apply_rust_validation_fixes.py
      - .github/workflows/apply-vision-media-pipeline.yml
      - src-tauri/Cargo.toml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Apply vision media pipeline patch
        run: python scripts/apply_vision_media_pipeline.py

      - name: Apply Rust validation fixes
        run: python scripts/apply_rust_validation_fixes.py

      - name: Diagnose transformed tests
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo '--- named tests ---'
          grep -R -n -C 12 -E 'blank_content_produces_one_page|user_message_content_without_media_stays_plain_text' src-tauri/src || true
          echo '--- inference relevant symbols ---'
          grep -n -C 8 -E 'attach_media_to_latest_user_message|latest_user_text|build_context' src-tauri/src/inference.rs || true
          echo '--- PDF relevant symbols ---'
          grep -n -C 8 -E 'generate_pdf_bytes|validate_pdf_output|pages.is_empty|PdfPage::new' src-tauri/src/document_generator.rs || true
          echo '--- inference diff ---'
          git diff -- src-tauri/src/inference.rs
          echo '--- document generator diff ---'
          git diff -- src-tauri/src/document_generator.rs

      - name: End diagnostic run
        run: exit 1
