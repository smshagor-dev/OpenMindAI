name: Apply web URL validation hardening

on:
  push:
    branches:
      - web-url-validation-hardening
    paths:
      - .github/workflows/apply-web-url-validation-hardening.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: web-url-validation-hardening
          fetch-depth: 0

      - name: Apply URL validation patch
        run: python scripts/apply_web_url_validation_hardening.py

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Validate URL security invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src-tauri/src/inference.rs').read_text(encoding='utf-8')
          required = [
              'reqwest::Url::parse(url)',
              "trim_start_matches('[')",
              "trim_end_matches(']')",
              'normalized_host.ends_with(".local")',
              'Ok(IpAddr::V4(address)) => is_public_ipv4(address)',
              'Ok(IpAddr::V6(address)) => is_public_ipv6(address)',
              'https://172.2.1.1/',
              'http://[fc00::1]/',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing URL hardening invariants: {missing}')
          if '!host.starts_with("172.2")' in text:
              raise SystemExit('legacy 172.2 prefix bug still present')
          PY

      - name: Remove one-off helper files
        run: |
          rm -f .github/workflows/apply-web-url-validation-hardening.yml
          rm -f scripts/apply_web_url_validation_hardening.py

      - name: Commit validated production source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden public web URL validation"
          git push origin HEAD:web-url-validation-hardening
