name: Interrupted run resume validation

on:
  push:
    branches:
      - "work/interrupted-run-resume"

permissions:
  contents: write

jobs:
  validate:
    name: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: python3 .github/interrupted-run-resume-apply.py
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Resume test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml only_interrupted_runs_are_resumable -- --nocapture
      - name: Database tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml database -- --nocapture
      - name: Durable run tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml openagent -- --nocapture
      - name: Diff check
        run: git diff --check
      - name: Remove temporary files
        run: rm -f .github/workflows/interrupted-run-resume-validate.yml .github/interrupted-run-resume-apply.py
      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: resume interrupted coding runs safely"
          git push origin HEAD:work/interrupted-run-resume
