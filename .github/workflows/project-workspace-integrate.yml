name: Project Workspace Integrate

on:
  push:
    branches:
      - project-local-workspace-access
    paths:
      - .github/workflows/project-workspace-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: project-local-workspace-access
      - name: Integrate project workspace surface and AI context
        shell: python
        run: |
          from pathlib import Path

          projects = Path("src/components/ProjectsWorkspace.tsx")
          text = projects.read_text()
          import_anchor = 'import { ConfirmDialog } from "./ConfirmDialog";\n'
          if 'ProjectLocalWorkspace' not in text:
              if import_anchor not in text:
                  raise SystemExit("ProjectsWorkspace import anchor missing")
              text = text.replace(
                  import_anchor,
                  import_anchor + 'import { ProjectLocalWorkspace } from "./ProjectLocalWorkspace";\n',
                  1,
              )

          render_anchor = '''              </section>\n            </div>\n          </>'''
          render_replacement = '''              </section>\n            </div>\n\n            <ProjectLocalWorkspace projectId={activeProject.id} projectName={activeProject.name} />\n          </>'''
          if '<ProjectLocalWorkspace projectId={activeProject.id}' not in text:
              if render_anchor not in text:
                  raise SystemExit("ProjectsWorkspace render anchor missing")
              text = text.replace(render_anchor, render_replacement, 1)
          projects.write_text(text)

          legacy = Path("src-tauri/src/lib_legacy.rs")
          text = legacy.read_text()
          old = '''    let project = ProjectRepository::new(db).project_for_conversation(conversation_id)?;\n    let content = project.as_ref().and_then(project_context_message);\n    ChatRepository::new(db).upsert_profile_context(conversation_id, content.as_deref())'''
          new = '''    let project = ProjectRepository::new(db).project_for_conversation(conversation_id)?;\n    let content = match project.as_ref() {\n        Some(project) => {\n            let mut parts = Vec::new();\n            if let Some(base) = project_context_message(project) {\n                parts.push(base);\n            }\n            if let Some(workspace) = local_workspace::workspace_context_for_project(db, &project.id)? {\n                parts.push(workspace);\n            }\n            (!parts.is_empty()).then(|| parts.join("\\n\\n"))\n        }\n        None => None,\n    };\n    ChatRepository::new(db).upsert_profile_context(conversation_id, content.as_deref())'''
          if new not in text:
              if old not in text:
                  raise SystemExit("project context sync anchor missing")
              text = text.replace(old, new, 1)

          old = '''    let content = project_context_message(project);\n    let chats = ChatRepository::new(db);'''
          new = '''    let mut parts = Vec::new();\n    if let Some(base) = project_context_message(project) {\n        parts.push(base);\n    }\n    if let Some(workspace) = local_workspace::workspace_context_for_project(db, &project.id)? {\n        parts.push(workspace);\n    }\n    let content = (!parts.is_empty()).then(|| parts.join("\\n\\n"));\n    let chats = ChatRepository::new(db);'''
          if new not in text:
              if old not in text:
                  raise SystemExit("project context project-wide sync anchor missing")
              text = text.replace(old, new, 1)
          legacy.write_text(text)

          backend = Path("src-tauri/src/local_workspace.rs")
          text = backend.read_text()
          text = text.replace(
              '''    while stdout.ends_with(['\\r', '\\n']) {\n        stdout.pop();\n    }''',
              '''    while stdout.ends_with('\\r') || stdout.ends_with('\\n') {\n        stdout.pop();\n    }''',
          )
          backend.write_text(text)

          Path(".github/workflows/project-workspace-integrate.yml").unlink()
      - name: Commit integration
        shell: bash
        run: |
          git config user.name openmindai-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "feat(projects): integrate local workspace into project chat"
          git push origin HEAD:project-local-workspace-access
