name: Runtime Windows Repair

on:
  push:
    branches:
      - work/runtime-guards-v2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply source repair
        run: python3 scripts/repair_runtime_windows.py
      - name: Remove bootstrap files
        run: rm -f scripts/repair_runtime_windows.py .github/workflows/runtime-windows-repair.yml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Commit repair
        run: |
          git config user.name "OpenMindAI Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore Windows runtime timeout handling"
          git push origin HEAD:work/runtime-guards-v2
