name: ChatGPT-style Work Production Patch

on:
  push:
    branches:
      - fix/chatgpt-style-work-apps

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/chatgpt-style-work-apps
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/chatgpt-work-ui-finalize.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])

          # Make Project open-agent replacement formatting-independent.
          open_pattern = re.compile(
              r"old_open = '''  const openAgentChat = async \(\) => \{.*?text = text\.replace\(old_open, new_open\)\n",
              re.S,
          )
          open_replacement = r'''open_start = text.index("  const openAgentChat = async () => {")
          open_end = text.index("\n  const linkConversation", open_start)
          new_open = """  const openAgentChat = async (draft?: string) => {
            const existing = projectConversations[0];
            if (existing) {
              props.onOpenConversation(existing.id, draft);
              return;
            }
            await createChat(draft);
          };
          """
          text = text[:open_start] + new_open + text[open_end:]
          '''
          script, count = open_pattern.subn(lambda _match: textwrap.dedent(open_replacement), script, count=1)
          if count != 1:
              raise SystemExit(f'Could not harden Project openAgentChat patch: {count}')

          # Make App ProjectsWorkspace handler replacement formatting-independent.
          app_pattern = re.compile(
              r"app = Path\(\"src/App\.tsx\"\).*?app\.write_text\(text, encoding=\"utf-8\"\)\n",
              re.S,
          )
          app_replacement = r'''app = Path("src/App.tsx")
          text = app.read_text(encoding="utf-8")
          projects_component = text.index("          <ProjectsWorkspace")
          handler_start = text.index("            onOpenConversation={(id) => {", projects_component)
          handler_end = text.index("\n            onCreateProjectChat=", handler_start)
          new_handler = """            onOpenConversation={(id, draft) => {
              setView("chat");
              setActiveId(id);
              setEditingMessageId(null);
              setAttachments([]);
              if (draft?.trim()) {
                setPrompt(draft.trim());
                window.setTimeout(() => {
                  const node = composerRef.current;
                  if (!node) return;
                  node.focus();
                  node.setSelectionRange(node.value.length, node.value.length);
                }, 0);
              }
            }}"""
          text = text[:handler_start] + new_handler + text[handler_end:]
          app.write_text(text, encoding="utf-8")
          '''
          script, count = app_pattern.subn(lambda _match: textwrap.dedent(app_replacement), script, count=1)
          if count != 1:
              raise SystemExit(f'Could not harden App project-chat patch: {count}')

          exec(compile(script, 'chatgpt-work-ui-production', 'exec'))
          PY

      - name: Fix generated type-safety issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/AppsSettings.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'setStatuses((current) => ({ ...current, [provider]: await api.connectIntegration(provider) }));'
          new = 'const connected = await api.connectIntegration(provider);\n    setStatuses((current) => ({ ...current, [provider]: connected }));'
          if old in text:
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate frontend
        run: |
          npm run lint
          npm run build

      - name: Verify UX contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "Connected Work" -n src docs
          ! grep -R "Work → GitHub\|Work → Google Workspace" -n src docs
          ! grep -R "Parameters (JSON)\|Run action" -n src/components
          test ! -e src/components/ConnectedWorkspace.tsx
          test ! -e src/components/Connectors.tsx
          test ! -e src/components/AdditionalConnectors.tsx
          grep -q 'label: "Apps"' src/components/SettingsDialog.tsx
          grep -q 'What should I work on?' src/components/ProjectsWorkspace.tsx
          grep -q 'Connected apps stay internal' src/components/ProjectsWorkspace.tsx

      - name: Commit production changes only
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/chatgpt-work-ui-finalize.yml \
            .github/workflows/chatgpt-work-ui-retry.yml \
            .github/workflows/chatgpt-work-ui-final-retry.yml \
            .github/workflows/chatgpt-work-ui-production.yml
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(work): make apps internal and simplify project work"
          git push origin HEAD:fix/chatgpt-style-work-apps
