name: Apply cached hardware profile

on:
  push:
    branches:
      - cache-hardware-profile

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cache-hardware-profile

      - name: Apply production hardware-cache patch
        run: python scripts/apply_cached_hardware_profile.py

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format production Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Remove one-shot helpers
        run: |
          rm .github/workflows/apply-cached-hardware-profile.yml
          rm scripts/apply_cached_hardware_profile.py

      - name: Diff hygiene
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src-tauri/src/lib.rs|src-tauri/src/artifacts.rs|src-tauri/src/media_preflight.rs|\.github/workflows/apply-cached-hardware-profile.yml|scripts/apply_cached_hardware_profile.py)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changed files:"; echo "$unexpected"; exit 1; }

      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reuse startup hardware profile across hot paths"
          git push origin HEAD:cache-hardware-profile
