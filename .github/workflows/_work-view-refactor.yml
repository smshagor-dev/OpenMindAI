name: Work View Refactor

on:
  push:
    branches:
      - fix/separate-work-projects-view

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Separate Work and Projects views
        shell: bash
        run: |
          set -euo pipefail
          cp src/components/ProjectsWorkspace.tsx src/components/WorkWorkspace.tsx
          python3 - <<'PY'
          from pathlib import Path

          work = Path('src/components/WorkWorkspace.tsx')
          text = work.read_text()
          old = 'export function ProjectsWorkspace(props: {'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, 'export function WorkWorkspace(props: {', 1)
          work.write_text(text)

          app = Path('src/App.tsx')
          text = app.read_text()

          old = 'import { ProjectsWorkspace } from "./components/ProjectsWorkspace";'
          new = old + '\nimport { WorkWorkspace } from "./components/WorkWorkspace";'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = 'type View = "chat" | "settings" | "tools" | "projects";'
          new = 'type View = "chat" | "work" | "settings" | "tools" | "projects";'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''                  : view === "tools"\n                    ? "Tools"\n                    : view === "projects"\n                      ? "Projects"\n                      : "Settings"}'''
          new = '''                  : view === "tools"\n                    ? "Tools"\n                    : view === "work"\n                      ? "Work"\n                      : view === "projects"\n                        ? "Projects"\n                        : "Settings"}'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''            <ChatModeSwitcher\n              active={view === "projects" ? "work" : "chat"}\n              onChat={() => setView("chat")}\n              onWork={() => setView("projects")}\n            />'''
          new = '''            <ChatModeSwitcher\n              active={view === "work" ? "work" : "chat"}\n              onChat={() => setView("chat")}\n              onWork={() => setView("work")}\n            />'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          marker = '''        ) : view === "projects" ? (\n          <ProjectsWorkspace'''
          assert text.count(marker) == 1, text.count(marker)
          work_block = '''        ) : view === "work" ? (\n          <WorkWorkspace\n            conversations={conversations}\n            onOpenConversation={(id, draft) => {\n              setView("chat");\n              setActiveId(id);\n              setEditingMessageId(null);\n              setAttachments([]);\n              if (draft?.trim()) {\n                setPrompt(draft.trim());\n                window.setTimeout(() => {\n                  const node = composerRef.current;\n                  if (!node) return;\n                  node.focus();\n                  node.setSelectionRange(node.value.length, node.value.length);\n                }, 0);\n              }\n            }}\n            onCreateProjectChat={createProjectConversation}\n          />\n        ) : view === "projects" ? (\n          <ProjectsWorkspace'''
          text = text.replace(marker, work_block, 1)

          old = '        <StatusBar models={models} activeModelId={activeModelId} runtime={runtime} root={root} />'
          new = '''        {view !== "work" ? (\n          <StatusBar models={models} activeModelId={activeModelId} runtime={runtime} root={root} />\n        ) : null}'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          app.write_text(text)

          sidebar = Path('src/components/Sidebar.tsx')
          text = sidebar.read_text()
          old = '  view: "chat" | "settings" | "tools" | "projects";'
          new = '  view: "chat" | "work" | "settings" | "tools" | "projects";'
          assert text.count(old) == 1, text.count(old)
          sidebar.write_text(text.replace(old, new, 1))
          PY

          git show 7308d93f55eb0e58d1ec0d46e6c8ec05fcc5352e:src/components/ProjectsWorkspace.tsx > src/components/ProjectsWorkspace.tsx
          npx prettier --write src/App.tsx src/components/Sidebar.tsx src/components/ProjectsWorkspace.tsx src/components/WorkWorkspace.tsx

      - name: Validate frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_work-view-refactor.yml
          git config user.name "openmindai-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/components/Sidebar.tsx src/components/ProjectsWorkspace.tsx src/components/WorkWorkspace.tsx .github/workflows/_work-view-refactor.yml
          git commit -m "fix(work): separate Work from project management"
          git push origin HEAD:fix/separate-work-projects-view
