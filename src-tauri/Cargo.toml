[package]
name = "open-mind-ai"
version = "3.0.0"
description = "Local-first portable AI desktop workstation"
authors = ["OpenMindAI"]
edition = "2021"

[lib]
name = "open_mind_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
docx-rs = "0.4.22"
flate2 = "1"
futures-util = "0.3"
hound = "3.5"
printpdf = "0.12.6"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.39"
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "8"

[target.'cfg(target_os = "android")'.dependencies]
# Android embeds llama.cpp instead of spawning the desktop llama-server process.
# OpenMP stays disabled for portable NDK packaging; libc++ is packaged as a shared
# runtime. encoding_rs is used to preserve UTF-8 boundaries while decoding token pieces.
encoding_rs = "0.8.35"
llama-cpp-2 = { version = "=0.1.154", default-features = false, features = ["android-shared-stdcxx"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
any-tts = { version = "0.1.3", default-features = false, features = ["kokoro"] }
whisper-rs = "0.16.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common"
] }

[dev-dependencies]
tempfile = "3"
