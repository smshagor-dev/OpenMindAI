[package]
name = "open-mind-ai"
version = "4.0.0"
description = "Local-first portable AI desktop workstation"
authors = ["OpenMindAI"]
edition = "2021"

[lib]
name = "open_mind_ai_lib"
crate-type = ["rlib"]

[features]
default = []
native-cxx-llama = ["dep:cxx"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
cxx-build = "1.0"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
cxx = { version = "1.0", optional = true }
dirs = "6"
flate2 = "1"
futures-util = "0.3"
hound = "3.5"
lopdf = { version = "=0.46.0", default-features = false }
printpdf = "0.12.6"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.39"
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "9.0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Retained only so the existing lockfile remains reproducible while historical
# mobile packages are still present in Cargo.lock. No Android/iOS application
# entry point or mobile feature code is compiled from this desktop-only repo.
[target.'cfg(target_os = "android")'.dependencies]
encoding_rs = "0.8.35"
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["android-shared-stdcxx", "mtmd"] }

[target.'cfg(target_os = "ios")'.dependencies]
encoding_rs = "0.8.35"
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["metal", "mtmd"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
any-tts = { version = "0.1.3", default-features = false, features = ["kokoro"] }
whisper-rs = "0.16.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }
windows-registry = "0.5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
any-tts = { path = "../vendor/any-tts-0.1.3" }
candle-core = { path = "../vendor/candle-core-0.10.2" }
