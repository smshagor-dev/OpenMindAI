[package]
name = "openmind-process-ownership-tests"
version = "0.0.0"
edition = "2021"
publish = false

# Compile the production ownership module without Tauri or model dependencies.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "process", "io-util"] }
tracing = "=0.1.44"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.27.0"
