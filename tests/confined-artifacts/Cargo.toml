[package]
name = "openmind-confined-artifacts-tests"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
[dependencies]
cap-std = "=4.0.3"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

lopdf = { version = "=0.44.0", default-features = false }

roxmltree = "=0.21.1"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
