[package]
name = "openmind-workspace-transactions-tests"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
[dev-dependencies]
tempfile = "3"
