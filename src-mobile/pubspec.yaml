name: openmindai_mobile
description: OpenMindAI mobile client for Android and iOS.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  file_picker: ^12.1.2
  flutter_markdown_plus: ^1.0.12
  html: ^0.15.7
  image_picker: ^1.2.3
  lib_llama_cpp: ^0.7.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf_struct_extractor: ^0.1.0
  permission_handler: ^13.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/LICENSE.txt
