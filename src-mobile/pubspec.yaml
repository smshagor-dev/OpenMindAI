name: openmindai_mobile
description: OpenMindAI mobile client for Android and iOS.
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  cross_file: ^0.3.5+2
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  file_picker: ^12.1.2
  flutter_local_notifications: ^22.3.0
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  html: ^0.15.7
  image_picker: ^1.2.3
  lib_llama_cpp: ^0.7.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx_engine: ^0.5.0
  pdf: ^3.13.0
  permission_handler: ^13.0.1
  record: ^6.2.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  whisper_ggml: ^2.6.0
  xml: ^7.0.1
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/LICENSE.txt
    - assets/icon.png
