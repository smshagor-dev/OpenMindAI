[project]
name = "openmindai-personalization-experiments"
version = "0.1.0"
description = "Offline, opt-in evaluation and per-user personalization experiments for OpenMindAI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
training = ["torch>=2.6,<3", "transformers>=4.57,<5", "peft>=0.17,<0.19", "psutil>=6,<8", "sentencepiece>=0.2,<1", "protobuf>=4,<8"]

[tool.openmindai]
production_dependency = false
base_model_immutable = true
requires_explicit_feedback = true
idle_only_training = true
require_holdout_improvement = true

[tool.ruff]
line-length = 100
