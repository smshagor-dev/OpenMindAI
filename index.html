<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <title>OpenMindAI</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        background: #090909;
      }

      body {
        overflow: hidden;
        color: #f5f5f5;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-frame {
        display: grid;
        width: 100%;
        height: 100vh;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, rgba(124, 92, 255, 0.08), transparent 34%), #090909;
      }

      .boot-content {
        display: grid;
        justify-items: center;
        gap: 13px;
      }

      .boot-content img {
        width: 52px;
        height: 52px;
        border-radius: 13px;
        background: #fff;
        object-fit: cover;
      }

      .boot-content strong {
        margin-top: 3px;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .boot-content span {
        color: #8f8f8f;
        font-size: 12px;
      }

      .boot-line {
        width: 180px;
        height: 3px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .boot-line::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #7c5cff;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }

      @keyframes boot-slide {
        from { transform: translateX(-15%); }
        to { transform: translateX(155%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-line::after { animation: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-frame" role="status" aria-label="Starting OpenMindAI">
        <div class="boot-content">
          <img src="/icon.png" alt="" />
          <strong>OpenMindAI</strong>
          <span>Starting your private AI workspace...</span>
          <div class="boot-line" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
