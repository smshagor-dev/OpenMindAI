<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f1f1" />
    <title>OpenMindAI</title>
    <script>
      // Keep the saved appearance through the native preference-loading screen.
      try {
        const savedTheme = localStorage.getItem("openmindai:theme");
        const theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : savedTheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f1f1f1" : "#090909");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --boot-bg: #ffffff;
        --boot-text: #171717;
        --boot-muted: #666666;
        --boot-track: #e3e3e3;
        --boot-accent: #6040c7;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --boot-bg: #090909;
        --boot-text: #f5f5f5;
        --boot-muted: #a0a0a0;
        --boot-track: #343434;
        --boot-accent: #7c5cff;
      }
      html,
      body,
      #root {
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--boot-bg);
      }

      body {
        overflow: hidden;
        color: var(--boot-text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-frame {
        display: grid;
        width: 100%;
        height: 100vh;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--boot-accent) 8%, transparent), transparent 34%), var(--boot-bg);
      }

      .boot-content {
        display: grid;
        justify-items: center;
        gap: 13px;
      }

      .boot-content img {
        width: 52px;
        height: 52px;
        border-radius: 13px;
        background: #fff;
        object-fit: cover;
      }

      .boot-content strong {
        margin-top: 3px;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .boot-content span {
        color: var(--boot-muted);
        font-size: 12px;
      }

      .boot-line {
        width: 180px;
        height: 3px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-track);
      }

      .boot-line::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--boot-accent);
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }

      @keyframes boot-slide {
        from { transform: translateX(-15%); }
        to { transform: translateX(155%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-line::after { animation: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-frame" role="status" aria-label="Starting OpenMindAI">
        <div class="boot-content">
          <img src="/icon.png" alt="" />
          <strong>OpenMindAI</strong>
          <span>Starting your private AI workspace...</span>
          <div class="boot-line" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
