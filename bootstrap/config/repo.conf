# Single source of truth for the official OpenMindAI repository.
# Every bootstrap script (Windows/Linux/macOS) reads this file instead of
# hardcoding the URL. Plain KEY=VALUE so it's trivially parseable from both
# POSIX shell (`. bootstrap/config/repo.conf`) and PowerShell without
# needing a JSON/YAML parser to be present on a fresh machine.

OPENMINDAI_REPO_URL=https://github.com/smshagor-dev/OpenMindAI.git
OPENMINDAI_REPO_BRANCH=main
OPENMINDAI_REPO_OWNER=smshagor-dev
OPENMINDAI_REPO_NAME=OpenMindAI
